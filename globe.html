<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2ede1">
<title>素描地球仪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f2ede1}
body{
  font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  color:#4a453d;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.dragging{cursor:grabbing}

/* 面板一律走纸面语言：米白底 + 铅笔灰细边 + 不规则圆角（读起来像手画的框） */
.card{
  position:absolute;z-index:2;
  background:rgba(246,242,233,.82);
  border:1px solid rgba(74,69,61,.34);
  border-radius:11px 6px 13px 7px / 7px 13px 6px 11px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  box-shadow:0 1px 0 rgba(74,69,61,.10), 0 6px 18px rgba(74,69,61,.06);
}

#title{top:18px;left:20px;padding:11px 16px 12px}
#title h1{font-size:17px;font-weight:600;letter-spacing:.13em;color:#3a3733}
#title p{margin-top:4px;font-size:10px;letter-spacing:.24em;color:#8d857a;text-transform:uppercase}

/* 中心读数：正对着的大概位置 */
#readout{
  top:18px;left:50%;transform:translateX(-50%);
  padding:9px 20px 10px;text-align:center;min-width:230px;
}
#place{font-size:16px;font-weight:600;letter-spacing:.06em;color:#3a3733;line-height:1.25}
#place .sub{font-size:11px;font-weight:400;color:#8d857a;letter-spacing:.12em;margin-left:7px}
#coord{
  margin-top:3px;font-size:11.5px;letter-spacing:.13em;color:#7c746a;
  font-variant-numeric:tabular-nums;
  font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
}
#readout.blur #place,#readout.blur #coord{opacity:.32;filter:blur(1.1px)}
#place,#coord{transition:opacity .18s,filter .18s}

/* 右下控制面板 */
#panel{right:20px;bottom:20px;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#panel button{
  font:inherit;font-size:12px;letter-spacing:.08em;color:#5a544b;
  background:rgba(255,253,247,.5);
  border:1px solid rgba(74,69,61,.26);
  border-radius:8px 5px 9px 6px / 6px 9px 5px 8px;
  padding:6px 11px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
#panel button:hover{background:rgba(255,253,247,.95);border-color:rgba(74,69,61,.5)}
#panel button.on{background:rgba(74,69,61,.87);color:#f6f2e9;border-color:rgba(74,69,61,.87)}

/* 左下操作提示 */
#hint{left:20px;bottom:20px;padding:9px 14px;font-size:11px;line-height:1.85;color:#8d857a;letter-spacing:.05em}
#hint b{color:#5a544b;font-weight:600}
#hint kbd{
  font:inherit;font-size:10px;background:rgba(74,69,61,.09);
  border:1px solid rgba(74,69,61,.2);border-radius:4px;padding:0 4px;color:#5a544b;
}
#zoom{position:absolute;right:20px;bottom:74px;z-index:2;font-size:11px;letter-spacing:.1em;color:#9a9287;
  font-variant-numeric:tabular-nums;text-align:right;pointer-events:none}

@media (max-width:700px){
  #title{top:12px;left:12px;padding:8px 12px 9px}
  #title h1{font-size:14px}
  #title p{font-size:9px;letter-spacing:.18em}
  #readout{top:auto;bottom:82px;padding:7px 16px 8px;min-width:200px}
  #place{font-size:14px}
  #hint{display:none}
  /* 竖屏手机上排成一行，免得两行按钮顶到读数卡片 */
  #panel{left:12px;right:12px;bottom:12px;grid-template-columns:repeat(5,1fr);gap:5px}
  #panel button{padding:7px 4px;text-align:center}
  #zoom{right:14px;bottom:64px}
}
</style>
</head>
<body>

<canvas id="globe"></canvas>

<div class="card" id="title">
  <h1>素描地球仪</h1>
  <p>Pencil Globe</p>
</div>

<div class="card" id="readout">
  <div id="place">太平洋<span class="sub">海域</span></div>
  <div id="coord">0.0°N&nbsp;&nbsp;0.0°E</div>
</div>

<div id="zoom">×1.00</div>

<div class="card" id="panel">
  <button id="bSpin" class="on">自转</button>
  <button id="bHatch" class="on">排线</button>
  <button id="bGrid" class="on">经纬网</button>
  <button id="bLevel">扶正</button>
  <button id="bReset">复位</button>
</div>

<div class="card" id="hint">
  <div><b>拖动</b>转动 · <b>甩一下</b>会一直转 · <b>滚轮/捏合</b>缩放</div>
  <div><b>双击</b>复位 · <kbd>←→↑↓</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>空格</kbd> <kbd>R</kbd></div>
</div>

/* ═══════════════════ 基础工具 ═══════════════════ */

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const D2R = Math.PI/180, R2D = 180/Math.PI, TAU = Math.PI*2;

/* 确定性哈希：手绘抖动必须绑定在顶点上，逐帧变会让线条满屏闪烁 */
function hash(a,b){let n=a*374761393+b*668265263;n=(n^(n>>13))*1274126177;return ((n^(n>>16))>>>0)/4294967295;}
const jit = (a,b) => hash(a,b)-0.5;

/* ═══════════════════ 数据解码 ═══════════════════ */

function b64bytes(s){
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}

/** varint / zigzag 读取器，对应 tools/build-globe-data.mjs 的写入器 */
class Reader{
  constructor(b){this.b=b;this.i=0;}
  u(){let r=0,s=0,c;do{c=this.b[this.i++];r|=(c&0x7f)<<s;s+=7;}while(c&0x80);return r>>>0;}
  s(){const v=this.u();return (v>>>1)^-(v&1);}
}

/** 解码成经纬度环；withOwner 时每环带一个国家索引 */
function decodeRings(b64,grid,withOwner){
  const rd=new Reader(b64bytes(b64)), out=[], n=rd.u();
  for(let k=0;k<n;k++){
    const owner = withOwner ? rd.u() : -1;
    const m=rd.u(), lon=new Float64Array(m), lat=new Float64Array(m);
    let px=0,py=0;
    for(let i=0;i<m;i++){
      px = i===0 ? rd.s() : px+rd.s();
      py = i===0 ? rd.s() : py+rd.s();
      lon[i]=px/grid; lat[i]=py/grid;
    }
    out.push({owner,lon,lat});
  }
  return out;
}

/**
 * 沿经纬度线性插值加密顶点。
 * 必须做：DP 简化会把南极洲沿 -90° 的那条边压成两个点，横跨 360° 经度；
 * 而下面的「展开投影」依赖相邻顶点在球面上足够近，否则会拉出穿过球心的直线。
 */
function densify(lon,lat,maxStep){
  const L=[],B=[], n=lon.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    let dlon=lon[j]-lon[i];
    if(dlon>180)dlon-=360; else if(dlon<-180)dlon+=360;
    const dlat=lat[j]-lat[i];
    const cosl=Math.cos((lat[i]+lat[j])*0.5*D2R);
    const arc=Math.hypot(dlon*cosl,dlat);
    const steps=Math.max(1,Math.ceil(arc/maxStep));
    for(let s=0;s<steps;s++){
      const t=s/steps;
      L.push(lon[i]+dlon*t); B.push(lat[i]+dlat*t);
    }
  }
  return [L,B];
}

/** 经纬度 → 单位球向量。lon=0,lat=0 正对镜头（+z） */
function toXYZ(L,B){
  const n=L.length, v=new Float64Array(n*3);
  for(let i=0;i<n;i++){
    const la=B[i]*D2R, lo=L[i]*D2R, c=Math.cos(la);
    v[i*3]=c*Math.sin(lo); v[i*3+1]=Math.sin(la); v[i*3+2]=c*Math.cos(lo);
  }
  return v;
}

function bboxOf(lon,lat){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<lon.length;i++){
    if(lon[i]<x0)x0=lon[i]; if(lon[i]>x1)x1=lon[i];
    if(lat[i]<y0)y0=lat[i]; if(lat[i]>y1)y1=lat[i];
  }
  return [x0,y0,x1,y1];
}

/** 环的包围球冠：中心方向 + 角半径的正弦，用来一次性剔掉整个转到背面的环 */
function capOf(xyz,n){
  let ax=0,ay=0,az=0;
  for(let i=0;i<n;i++){ax+=xyz[i*3];ay+=xyz[i*3+1];az+=xyz[i*3+2];}
  const l=Math.hypot(ax,ay,az);
  if(l<1e-9) return {x:0,y:0,z:1,sin:1};   // 退化成整球，等于不剔
  ax/=l;ay/=l;az/=l;
  let mn=1;
  for(let i=0;i<n;i++){
    const d=ax*xyz[i*3]+ay*xyz[i*3+1]+az*xyz[i*3+2];
    if(d<mn) mn=d;
  }
  const ang=Math.acos(clamp(mn,-1,1));
  /* sin 用夹住的角（剔除要保守）；cos 用真实角，可能为负（对跖点判定要保守） */
  return {x:ax,y:ay,z:az,sin:Math.sin(Math.min(ang,Math.PI/2)),cos:Math.cos(ang)};
}

/* 海岸线：加密后转成球面向量，环已按面积降序排好（天然是一档 LOD） */
const LAND = decodeRings(LAND_D,64,false).map(r=>{
  const [L,B]=densify(r.lon,r.lat,1.4);
  const xyz=toXYZ(L,B);
  return {xyz, n:L.length, lon:r.lon, lat:r.lat, bb:bboxOf(r.lon,r.lat), cap:capOf(xyz,L.length)};
});

/* q = [x,y,z,w]，表示「世界 → 视空间」的旋转 */
function qmul(a,b,o){
  const ax=a[0],ay=a[1],az=a[2],aw=a[3], bx=b[0],by=b[1],bz=b[2],bw=b[3];
  o[0]=aw*bx+ax*bw+ay*bz-az*by;
  o[1]=aw*by-ax*bz+ay*bw+az*bx;
  o[2]=aw*bz+ax*by-ay*bx+az*bw;
  o[3]=aw*bw-ax*bx-ay*by-az*bz;
  return o;
}
function qnorm(q){
  const l=Math.hypot(q[0],q[1],q[2],q[3])||1;
  q[0]/=l;q[1]/=l;q[2]/=l;q[3]/=l;return q;
}
function qaxis(x,y,z,ang,o){
  const l=Math.hypot(x,y,z);
  if(l<1e-12){o[0]=o[1]=o[2]=0;o[3]=1;return o;}
  const h=ang*0.5, s=Math.sin(h)/l;
  o[0]=x*s;o[1]=y*s;o[2]=z*s;o[3]=Math.cos(h);return o;
}
function qslerp(a,b,t,o){
  let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
  let bx=b[0],by=b[1],bz=b[2],bw=b[3];
  if(d<0){d=-d;bx=-bx;by=-by;bz=-bz;bw=-bw;}
  let s0,s1;
  if(d>0.9995){s0=1-t;s1=t;}
  else{const th=Math.acos(d),st=Math.sin(th);s0=Math.sin((1-t)*th)/st;s1=Math.sin(t*th)/st;}
  o[0]=a[0]*s0+bx*s1;o[1]=a[1]*s0+by*s1;o[2]=a[2]*s0+bz*s1;o[3]=a[3]*s0+bw*s1;
  return qnorm(o);
}
/** 行主序 3×3 旋转矩阵 */
function qmat(q,m){
  const x=q[0],y=q[1],z=q[2],w=q[3];
  const x2=x+x,y2=y+y,z2=z+z;
  const xx=x*x2,xy=x*y2,xz=x*z2,yy=y*y2,yz=y*z2,zz=z*z2;
  const wx=w*x2,wy=w*y2,wz=w*z2;
  m[0]=1-yy-zz; m[1]=xy-wz;   m[2]=xz+wy;
  m[3]=xy+wz;   m[4]=1-xx-zz; m[5]=yz-wx;
  m[6]=xz-wy;   m[7]=yz+wx;   m[8]=1-xx-yy;
  return m;
}
/** 北极朝上、正对 (lon,lat) 的朝向 */
function qLookAt(lon,lat,o){
  const a=[0,0,0,1],b=[0,0,0,1];
  qaxis(0,1,0,-lon*D2R,a);
  qaxis(1,0,0,lat*D2R,b);
  return qmul(b,a,o);
}

/* ═══════════════════ 状态 ═══════════════════ */

const S = {
  q:[0,0,0,1],            // 当前朝向
  omega:[0,0,0],          // 视空间角速度（rad/s），甩出去之后靠它续转
  zoom:1,                 // 相对适配半径的倍数
  zoomV:0,
  spin:true, hatch:true, grid:true,
  dragging:false,
  anim:null,              // 扶正/复位的缓动
  lon:0, lat:0,           // 正对着的经纬度
  still:0,                // 静止时长，用来触发精细重绘
};

const MAX_OMEGA = 12;     // 「疯狂转动」要真的疯
const DAMP_HALFLIFE = 1.9;// 甩一下能转好几秒
const IDLE_SPIN = 0.055;  // 自转角速度
const ZMIN = 0.55, ZMAX = 5;

/* ═══════════════════ 画布 ═══════════════════ */

const cv = $('globe'), ctx = cv.getContext('2d');
const paper = document.createElement('canvas'), pctx = paper.getContext('2d');
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');
/*
 * 陆地排线的离屏遮罩。刻意做成「只有球那么大」而不是整屏那么大：
 * clearRect / destination-in 都是全画布语义，软件光栅下按画布面积收费，
 * 整屏尺寸时光这两步就要 25ms 以上。尺寸按 64px 取整，缩放时才重建。
 */
const mask  = document.createElement('canvas'), mctx = mask.getContext('2d');
function ensureMask(bx,by,bw,bh){
  const w=Math.ceil(bw*RS/64)*64, h=Math.ceil(bh*RS/64)*64;
  if(mask.width!==w||mask.height!==h){ mask.width=w; mask.height=h; }
  /* 屏幕坐标 → 遮罩画布坐标，画的时候还是用屏幕坐标，省得到处换算 */
  mctx.setTransform(RS,0,0,RS,-bx*RS,-by*RS);
}
let W=0,H=0,DPR=1,cx=0,cy=0,R0=1,R=1;

/*
 * RS = 当前这一帧实际渲染的像素密度。
 * 素描的成本几乎全在填充像素上，跟 RS² 成正比。所以转动时降密度换帧率
 * （转起来根本看不清细节），停下来再用满密度重画一张缓存 —— 该看清的时候
 * 是清楚的。具体降多少由下面的帧时调节器按真实机器的表现自己找。
 */
let RS=1;
function setScale(s){
  s=clamp(s,0.7,DPR);
  if(Math.abs(s-RS)<0.02) return;
  RS=s;
  cv.width=Math.round(W*RS); cv.height=Math.round(H*RS);
  ctx.setTransform(RS,0,0,RS,0,0);
}

const PAPER='#f2ede1', INK='58,55,51';

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  for(const c of [cv,paper,layer]){c.width=W*DPR;c.height=H*DPR;}
  cv.style.width=W+'px'; cv.style.height=H+'px';
  for(const c of [ctx,pctx,lctx]) c.setTransform(DPR,0,0,DPR,0,0);
  RS=DPR;
  cx=W/2; cy=H/2;
  /* 竖屏手机上 H 远大于 W，只按短边算球会小得可怜，所以两边各给一个上限 */
  R0=Math.min(W*0.42,H*0.34);
  makePaper();
  dirty=true;
}

/* ── 纸：底色 + 纤维 + 颗粒（小块噪点平铺，避免全屏 ImageData 卡顿）+ 暗角 ── */
function makePaper(){
  const g=pctx;
  g.clearRect(0,0,W,H);
  g.fillStyle=PAPER; g.fillRect(0,0,W,H);

  const T=180, tile=document.createElement('canvas');
  tile.width=tile.height=T;
  const tg=tile.getContext('2d'), img=tg.createImageData(T,T), d=img.data;
  for(let i=0;i<T*T;i++){
    const v=hash(i,7717);
    d[i*4]=d[i*4+1]=d[i*4+2]=0;
    d[i*4+3]=v<0.5?0:Math.round((v-0.5)*44);
  }
  tg.putImageData(img,0,0);
  g.globalAlpha=.5; g.fillStyle=g.createPattern(tile,'repeat'); g.fillRect(0,0,W,H); g.globalAlpha=1;

  g.strokeStyle='rgba(120,110,95,.03)'; g.lineWidth=1;
  for(let i=0;i<Math.round(W*H/9000);i++){
    const x=hash(i,31)*W, y=hash(i,97)*H, a=hash(i,131)*TAU, len=4+hash(i,181)*26;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len); g.stroke();
  }

  const vg=g.createRadialGradient(cx,cy,Math.min(W,H)*0.3,cx,cy,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(120,108,88,0)');
  vg.addColorStop(1,'rgba(120,108,88,.14)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}

/* ═══════════════════ 投影 ═══════════════════ */

const M=new Float64Array(9);

/*
 * 「展开投影」：正面按正交投影落在半径 R 的圆盘内，背面则塌到圆盘外一丝
 * （半径 R → 1.02R 的窄环带）。好处是同一条闭合环投影后仍然闭合，
 * 直接 clip 到圆盘就得到正确的可见区域，不用手写球面多边形裁剪。
 */
let lastDX=1,lastDY=0;
function projFill(x,y,z,out){
  const r=Math.hypot(x,y);
  let dx,dy;
  if(r>1e-7){dx=x/r;dy=y/r;lastDX=dx;lastDY=dy;} else {dx=lastDX;dy=lastDY;}
  const rad = z>=0 ? r : 1+(1-r)*0.02;
  out[0]=cx+dx*rad*R; out[1]=cy-dy*rad*R;
}

/* ── 填充/裁剪路径：所有环，背面塌边 ── */
const _p=[0,0];
function buildLandPath(){
  const path=new Path2D();
  /* 正对镜头的世界方向；整个球冠都在它背面的环直接跳过 */
  const wx0=M[6],wy0=M[7],wz0=M[8];
  let flip=false;
  for(let k=0;k<LAND.length;k++){
    const L=LAND[k], c=L.cap;
    if(c.x*wx0+c.y*wy0+c.z*wz0 < -c.sin) continue;
    const v=L.xyz, n=L.n;
    for(let i=0;i<n;i++){
      const wx=v[i*3],wy=v[i*3+1],wz=v[i*3+2];
      const x=M[0]*wx+M[1]*wy+M[2]*wz;
      const y=M[3]*wx+M[4]*wy+M[5]*wz;
      const z=M[6]*wx+M[7]*wy+M[8]*wz;
      projFill(x,y,z,_p);
      if(i===0) path.moveTo(_p[0],_p[1]); else path.lineTo(_p[0],_p[1]);
    }
    path.closePath();
    /*
     * 展开投影下，一个环的 even-odd「内部」= 不含视点对跖点的那一侧。
     * 所以只要对跖点落在某个「已经画进路径」的环里，整张路径的奇偶性就
     * 整体翻转了 —— 补一个大圆把它翻回来即可。对跖点最多落在一个环里。
     */
    if(!flip && -(c.x*wx0+c.y*wy0+c.z*wz0) > c.cos &&
       inRing(normLon(S.lon+180),-S.lat,L)) flip=true;
  }
  if(flip){
    path.moveTo(cx+R*1.4,cy);
    path.arc(cx,cy,R*1.4,0,TAU);
  }
  return path;
}

/* ── 描边路径：只画正面，跨过地平线的边精确插值到边缘再断开 ── */
function strokeVisible(g,v,n,seed,amp,closed){
  let px=0,py=0,pz=0,has=false,started=false;
  const step = closed ? n+1 : n;
  for(let i=0;i<step;i++){
    const k=(i%n)*3;
    const wx=v[k],wy=v[k+1],wz=v[k+2];
    const x=M[0]*wx+M[1]*wy+M[2]*wz;
    const y=M[3]*wx+M[4]*wy+M[5]*wz;
    const z=M[6]*wx+M[7]*wy+M[8]*wz;
    if(has){
      if(pz>0&&z>0){
        const jx=jit(i+seed,17)*amp, jy=jit(i+seed,53)*amp;
        g.lineTo(cx+x*R+jx, cy-y*R+jy);
      } else if(pz>0&&z<=0){
        const t=pz/(pz-z), ix=px+(x-px)*t, iy=py+(y-py)*t;
        const il=Math.hypot(ix,iy)||1;
        g.lineTo(cx+ix/il*R, cy-iy/il*R);
        started=false;
      } else if(pz<=0&&z>0){
        const t=pz/(pz-z), ix=px+(x-px)*t, iy=py+(y-py)*t;
        const il=Math.hypot(ix,iy)||1;
        g.moveTo(cx+ix/il*R, cy-iy/il*R);
        const jx=jit(i+seed,17)*amp, jy=jit(i+seed,53)*amp;
        g.lineTo(cx+x*R+jx, cy-y*R+jy);
        started=true;
      }
    } else if(z>0){
      const jx=jit(i+seed,17)*amp, jy=jit(i+seed,53)*amp;
      g.moveTo(cx+x*R+jx, cy-y*R+jy);
      started=true;
    }
    px=x;py=y;pz=z;has=true;
  }
  return started;
}

/* ═══════════════════ 位置查询 ═══════════════════ */

/** 经纬度平面上的交叉数判定；Natural Earth 的环已在 ±180 处切开，可以直接平面处理 */
function inRing(lon,lat,r){
  const bb=r.bb;
  if(lon<bb[0]||lon>bb[2]||lat<bb[1]||lat>bb[3]) return false;
  const X=r.lon,Y=r.lat,n=X.length;
  let inside=false;
  for(let i=0,j=n-1;i<n;j=i++){
    if((Y[i]>lat)!==(Y[j]>lat) && lon < (X[j]-X[i])*(lat-Y[i])/(Y[j]-Y[i])+X[i]) inside=!inside;
  }
  return inside;
}

function normLon(l){l=((l+180)%360+360)%360-180;return l;}

function pointInLand(lon,lat){
  lon=normLon(lon);
  let odd=false;
  for(let i=0;i<LAND.length;i++) if(inRing(lon,lat,LAND[i])) odd=!odd;
  return odd;
}

/** 落陆地 → 国名 + 大洲；落水 → 最近的海域锚点 */
function locate(lon,lat){
  lon=normLon(lon);
  const par=new Map();
  for(let i=0;i<CTRY.length;i++){
    const r=CTRY[i];
    if(inRing(lon,lat,r)) par.set(r.owner,!par.get(r.owner));
  }
  for(const [o,v] of par) if(v) return {name:CTRY_NAME[o], sub:CTRY_CONT[o]};

  const la=lat*D2R, lo=lon*D2R, cla=Math.cos(la), sla=Math.sin(la);
  let best=0,bd=-2;
  for(let i=0;i<SEAS.length;i++){
    const s=SEAS[i], b=s[1]*D2R;
    const d=sla*Math.sin(b)+cla*Math.cos(b)*Math.cos(s[0]*D2R-lo);
    if(d>bd){bd=d;best=i;}
  }
  return {name:SEAS[best][2], sub:'海域'};
}

/* ═══════════════════ 素描渲染 ═══════════════════ */

/* 光从左上偏前方来 */
const LX=-0.52,LY=0.58,LZ=0.63;

/** 屏幕点 → 球面法线 → 明暗（0 亮 / 1 暗），盘外返回 -1 */
function shadeAt(px,py){
  const nx=(px-cx)/R, ny=-(py-cy)/R, q=nx*nx+ny*ny;
  if(q>=1) return -1;
  const d=nx*LX+ny*LY+Math.sqrt(1-q)*LZ;
  return 1-(d>0?d:0);
}

/**
 * 一族平行排线。每段的深浅由中点处的球面明暗决定 —— 明暗交界自然出现在
 * 排线的疏密里，而不是靠渐变糊上去。
 *
 * 每帧会产生上千段笔画，逐段 stroke() 会把帧率拖到 20fps 以下（每次 stroke
 * 都要重新对裁剪区做一次光栅化）。所以把笔画按深浅分进 NB 个桶，每桶只发
 * 一次 stroke —— 视觉上看不出区别，stroke 调用量掉两个数量级。
 */
const NB=5;
const _buck=[]; for(let i=0;i<NB;i++) _buck.push(null);

function hatch(g,angle,spacing,segLen,bias,gain,alphaMax,seed,floor){
  const ca=Math.cos(angle), sa=Math.sin(angle);
  const lim=R*1.02;
  floor=floor||0;
  const lo=Math.max(floor,0.02), span=Math.max(alphaMax-lo,1e-3);
  for(let i=0;i<NB;i++) _buck[i]=null;

  let li=0;
  for(let off=-lim; off<=lim; off+=spacing, li++){
    const h=Math.sqrt(Math.max(0,R*R-off*off));
    if(h<3) continue;
    const ox=cx-sa*off, oy=cy+ca*off;
    /* 每条线的分段起点错开，免得段与段的接缝在画面上排成一列 */
    let t=-h+jit(li+seed,211)*segLen;
    while(t<h){
      const len=segLen*(0.72+hash(li*97+(t|0),seed+5)*0.62);
      const t1=Math.min(t+len,h);
      if(t1-t>2.2){
        const mx=ox+ca*(t+t1)*0.5, my=oy+sa*(t+t1)*0.5;
        const sh=shadeAt(mx,my);
        if(sh>=0){
          /*
           * floor 是「底调」：铅笔画里陆地整体先有一层石墨调子，明暗只是在
           * 底调上加减。纯靠 Lambert 驱动 alpha 的话，受光的那三分之二会
           * 完全没有调子，整张图就散成一张很淡的线稿。
           */
          const a=Math.min(Math.max(floor,(sh-bias)*gain),alphaMax);
          if(a>0.014){
            /* 桶要摊在 [lo,alphaMax] 上而不是 [0,alphaMax]：有底调时所有笔画
               都挤在高位，按 0 起算会把它们全塞进同一个桶并压暗成底调值 */
            const bi=clamp(((a-lo)/span*NB)|0,0,NB-1);
            let P=_buck[bi]; if(!P) P=_buck[bi]=new Path2D();
            const w=jit(li*131+(t|0),seed+9)*1.1;
            const bend=w+jit(li,seed+3)*1.3;
            P.moveTo(ox+ca*t-sa*w, oy+sa*t+ca*w);
            /* 中点抬一点点，笔画就不是死直的 */
            P.quadraticCurveTo(mx-sa*bend, my+ca*bend, ox+ca*t1-sa*w, oy+sa*t1+ca*w);
          }
        }
      }
      t=t1+segLen*(0.16+hash(li*57+(t|0),seed+2)*0.3);
    }
  }

  g.lineCap='round';
  for(let i=0;i<NB;i++){
    if(!_buck[i]) continue;
    const a=lo+span*(i+0.5)/NB;
    g.globalAlpha=a;
    g.lineWidth=0.62+a*1.5;
    g.stroke(_buck[i]);
  }
  g.globalAlpha=1;
}

/** 经纬网：每 30° 一条，赤道与本初子午线略重 */
const GRID=[];
(function(){
  for(let lo=-180;lo<180;lo+=30){
    const L=[],B=[];
    for(let la=-88;la<=88;la+=2){L.push(lo);B.push(la);}
    GRID.push({v:toXYZ(L,B),n:L.length,major:lo===0,closed:false});
  }
  for(let la=-60;la<=60;la+=30){
    const L=[],B=[];
    for(let lo=-180;lo<180;lo+=3){L.push(lo);B.push(la);}
    GRID.push({v:toXYZ(L,B),n:L.length,major:la===0,closed:true});
  }
})();

function drawGrid(g,detail){
  g.strokeStyle='rgba('+INK+',1)';
  g.lineJoin='round'; g.lineCap='round';
  const minor=new Path2D(), major=new Path2D();
  for(let i=0;i<GRID.length;i++){
    const G=GRID[i];
    strokeVisible(G.major?major:minor,G.v,G.n,i*613,detail?0.85:0.5,G.closed);
  }
  g.globalAlpha=0.155; g.lineWidth=0.7;  g.stroke(minor);
  g.globalAlpha=0.30;  g.lineWidth=0.95; g.stroke(major);
  g.globalAlpha=1;
}

/** 海岸线：多遍低透明度错位描边，做出铅笔「找线」的复笔感 */
function drawCoast(g,passes,amp){
  g.strokeStyle='rgba('+INK+',1)';
  g.lineJoin='round'; g.lineCap='round';
  for(let p=0;p<passes;p++){
    const path=new Path2D();
    for(let k=0;k<LAND.length;k++){
      const L=LAND[k];
      strokeVisible(path,L.xyz,L.n,k*1013+p*7919,amp*(p?1.7:1),true);
    }
    g.globalAlpha=p===0?0.82:0.4;
    g.lineWidth=p===0?1.5:0.95;
    g.stroke(path);
  }
  g.globalAlpha=1;
}

/** 剪影圆：全圈一道淡的，背光那侧再压一道重的 —— 让球看起来是球全靠这个 */
function drawLimb(g,detail){
  g.strokeStyle='rgba('+INK+',1)';
  g.lineCap='round';
  const steps=Math.max(90,Math.round(R*0.7));
  for(let p=0;p<(detail?3:2);p++){
    const path=new Path2D();
    for(let i=0;i<=steps;i++){
      const a=i/steps*TAU, d=R+jit(i+p*331,71)*1.5+(p?0.9:0);
      const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
      if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
    }
    g.globalAlpha=p===0?0.6:0.28;
    g.lineWidth=p===0?1.6:1;
    g.stroke(path);
  }
  /* 背光弧：右下缘压重，球才立得起来 */
  const dark=Math.atan2(LY,-LX)+Math.PI;
  const arcs=detail?5:3;
  for(let p=0;p<arcs;p++){
    const path=new Path2D();
    /* 一层比一层往里收、往里淡，堆出边缘那圈炭笔晕染 */
    const spread=1.15+p*0.16, a0=dark-spread, a1=dark+spread, n=72;
    for(let i=0;i<=n;i++){
      const a=a0+(a1-a0)*i/n, d=R-p*2.6+jit(i+p*97,151)*1.6;
      const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d;
      if(i===0) path.moveTo(x,y); else path.lineTo(x,y);
    }
    g.globalAlpha=0.26-p*0.04;
    g.lineWidth=2.2+p*1.6;
    g.stroke(path);
  }
  g.globalAlpha=1;
}

/** 中心准星：手绘十字 + 四角刻度 */
function drawCross(g){
  const s=13,gap=5;
  g.strokeStyle='rgba('+INK+',.62)'; g.lineWidth=1; g.lineCap='round';
  g.beginPath();
  g.moveTo(cx-s,cy+jit(1,3)*.8); g.lineTo(cx-gap,cy+jit(2,3)*.8);
  g.moveTo(cx+gap,cy+jit(3,3)*.8); g.lineTo(cx+s,cy+jit(4,3)*.8);
  g.moveTo(cx+jit(5,3)*.8,cy-s); g.lineTo(cx+jit(6,3)*.8,cy-gap);
  g.moveTo(cx+jit(7,3)*.8,cy+gap); g.lineTo(cx+jit(8,3)*.8,cy+s);
  g.stroke();
  g.globalAlpha=.5;
  g.beginPath(); g.arc(cx,cy,3.1,0,TAU); g.stroke();
  g.globalAlpha=1;
}

/** 一整帧的墨线。detail=true 时上密排线与交叉排线 */
function render(g,detail){
  g.clearRect(0,0,W,H);
  g.drawImage(paper,0,0,W,H);

  /* 球的外接框：所有铺满型的填充都限制在这里，别去光栅化整块画布 */
  const bx=Math.max(0,cx-R-3), by=Math.max(0,cy-R-3);
  const bw=Math.min(W,cx+R+3)-bx, bh=Math.min(H,cy+R+3)-by;

  g.save();
  g.beginPath(); g.arc(cx,cy,R,0,TAU); g.clip();
  g.globalCompositeOperation='multiply';

  /*
   * 排线间距是调子的关键：线宽约 1px，间距 12px 的话平均只压暗 1%，等于没画。
   * 陆地要读成一块调子，间距必须收到 5~8px 这一档，单笔的 alpha 也得够。
   */
  const base=clamp(R*0.030,3.4,8);         // 排线间距随球大小走
  const seg=clamp(R*0.1,9,26);
  const amp=clamp(R*0.0045,0.45,1.9);      // 手抖幅度

  /* 海面：只在贴近暗部边缘落几笔撑住球体的形，别把海画满（floor=0） */
  if(S.hatch){
    g.strokeStyle='rgba('+INK+',1)';
    hatch(g,38*D2R, base*(detail?3.4:4.6), seg*1.3, 0.62, 1.5, detail?0.17:0.12, 401, 0);
  }

  const land=buildLandPath();

  if(S.hatch){
    /*
     * 陆地排线不能直接 clip(陆地路径) 再 stroke —— 每次 stroke 都要对着四千多个
     * 顶点的复杂裁剪区重新光栅化，实测能把帧率压到 20fps 以下。
     * 改成：在遮罩画布上整盘铺排线（无裁剪），再用 destination-in 拿陆地形状
     * 剪一刀 —— 全帧只做这一次复杂路径运算，最后整块贴回来。
     */
    ensureMask(bx,by,bw,bh);
    mctx.save(); mctx.setTransform(1,0,0,1,0,0);
    mctx.clearRect(0,0,mask.width,mask.height); mctx.restore();
    mctx.globalCompositeOperation='source-over';
    mctx.strokeStyle='rgba('+INK+',1)';
    /* 主排线：floor 给整块陆地铺底调，Lambert 只负责在底调上加深 */
    hatch(mctx,38*D2R, base*(detail?1:1.8), seg, 0.05, 0.8, 0.62, 17, detail?0.32:0.28);
    if(detail){
      /* 交叉排线：从明暗交界一路压到暗部 */
      hatch(mctx,-24*D2R, base*1.6, seg*0.95, 0.24, 0.85, 0.46, 733, 0);
      hatch(mctx,82*D2R, base*2.6, seg*0.85, 0.52, 1.05, 0.4, 991, 0);
    }
    mctx.globalCompositeOperation='destination-in';
    mctx.fillStyle='#000';
    mctx.fill(land,'evenodd');

    g.globalCompositeOperation='multiply';
    g.drawImage(mask,0,0,bw*RS,bh*RS,bx,by,bw,bh);
  } else {
    g.globalAlpha=.055; g.fillStyle='rgb('+INK+')'; g.fill(land,'evenodd'); g.globalAlpha=1;
    g.globalCompositeOperation='multiply';
  }

  if(S.grid) drawGrid(g,detail);
  drawCoast(g,detail?3:1,amp);
  drawLimb(g,detail);

  g.restore();
  drawCross(g);
}

/* ═══════════════════ 交互 ═══════════════════ */

/** 屏幕点 → 视空间单位球向量（盘外的落到边缘上） */
function pick(px,py){
  let x=(px-cx)/R, y=-(py-cy)/R;
  const q=x*x+y*y;
  if(q<=1) return [x,y,Math.sqrt(1-q)];
  const l=Math.sqrt(q);
  return [x/l,y/l,0];
}

const ptrs=new Map();
let lastMoveT=0, dragOm=[0,0,0], pinchD=0, lastTap=0;
const _dq=[0,0,0,1];

function applyDelta(a,b,dt){
  const ax=a[1]*b[2]-a[2]*b[1], ay=a[2]*b[0]-a[0]*b[2], az=a[0]*b[1]-a[1]*b[0];
  const dot=clamp(a[0]*b[0]+a[1]*b[1]+a[2]*b[2],-1,1);
  const ang=Math.acos(dot);
  if(!(ang>1e-6)) return;
  qaxis(ax,ay,az,ang,_dq);
  qnorm(qmul(_dq,S.q,S.q));                    // 视空间增量：左乘
  const l=Math.hypot(ax,ay,az)||1, rate=ang/Math.max(dt,1/240);
  dragOm[0]=lerp(dragOm[0],ax/l*rate,0.4);
  dragOm[1]=lerp(dragOm[1],ay/l*rate,0.4);
  dragOm[2]=lerp(dragOm[2],az/l*rate,0.4);
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  S.anim=null;
  if(ptrs.size===1){
    S.dragging=true; cv.classList.add('dragging');
    S.omega[0]=S.omega[1]=S.omega[2]=0;
    dragOm=[0,0,0]; lastMoveT=performance.now();
    const now=performance.now();
    if(now-lastTap<300) reset();
    lastTap=now;
  } else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchD=Math.hypot(a.x-b.x,a.y-b.y);
  }
});

cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p) return;
  const now=performance.now(), dt=(now-lastMoveT)/1000;
  lastMoveT=now;
  if(ptrs.size===1){
    applyDelta(pick(p.x,p.y),pick(e.clientX,e.clientY),dt);
  } else if(ptrs.size===2){
    p.x=e.clientX; p.y=e.clientY;
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0) S.zoom=clamp(S.zoom*(d/pinchD),ZMIN,ZMAX);
    pinchD=d;
  }
  p.x=e.clientX; p.y=e.clientY;
  dirty=true;
});

function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    S.dragging=false; cv.classList.remove('dragging');
    const l=Math.hypot(dragOm[0],dragOm[1],dragOm[2]);
    const k=l>MAX_OMEGA?MAX_OMEGA/l:1;
    S.omega[0]=dragOm[0]*k; S.omega[1]=dragOm[1]*k; S.omega[2]=dragOm[2]*k;
  } else if(ptrs.size<2) pinchD=0;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  S.anim=null;
  S.zoom=clamp(S.zoom*Math.exp(-e.deltaY*(e.deltaMode===1?0.02:0.0016)),ZMIN,ZMAX);
  dirty=true;
},{passive:false});

cv.addEventListener('dblclick',e=>{e.preventDefault();reset();});

function animateTo(q,zoom,dur){
  S.anim={from:S.q.slice(),to:q,z0:S.zoom,z1:zoom,t:0,dur};
  S.omega[0]=S.omega[1]=S.omega[2]=0;
}
function level(){ animateTo(qLookAt(S.lon,S.lat,[0,0,0,1]),S.zoom,0.55); }
function reset(){ animateTo(qLookAt(105,25,[0,0,0,1]),1,0.75); }

$('bSpin').onclick=e=>{S.spin=!S.spin;e.target.classList.toggle('on',S.spin);};
$('bHatch').onclick=e=>{S.hatch=!S.hatch;e.target.classList.toggle('on',S.hatch);dirty=true;};
$('bGrid').onclick=e=>{S.grid=!S.grid;e.target.classList.toggle('on',S.grid);dirty=true;};
$('bLevel').onclick=level;
$('bReset').onclick=reset;

addEventListener('keydown',e=>{
  const nudge=(x,y,z)=>{qnorm(qmul(qaxis(x,y,z,0.13,_dq),S.q,S.q));S.anim=null;dirty=true;};
  switch(e.key){
    case 'ArrowLeft':  nudge(0,-1,0); break;
    case 'ArrowRight': nudge(0,1,0);  break;
    case 'ArrowUp':    nudge(-1,0,0); break;
    case 'ArrowDown':  nudge(1,0,0);  break;
    case '+': case '=': S.zoom=clamp(S.zoom*1.25,ZMIN,ZMAX); dirty=true; break;
    case '-': case '_': S.zoom=clamp(S.zoom/1.25,ZMIN,ZMAX); dirty=true; break;
    case ' ': S.spin=!S.spin; $('bSpin').classList.toggle('on',S.spin); e.preventDefault(); break;
    case 'r': case 'R': reset(); break;
    case 'h': case 'H': $('bHatch').click(); break;
    case 'g': case 'G': $('bGrid').click(); break;
    default: return;
  }
});

addEventListener('resize',resize);

/* ═══════════════════ 主循环 ═══════════════════ */

const elPlace=$('place'), elCoord=$('coord'), elZoom=$('zoom'), elRead=$('readout');
let dirty=true, lastT=performance.now(), infoT=0, lastKey='';
const _sq=[0,0,0,1];

function step(dt){
  if(S.anim){
    const a=S.anim;
    a.t=Math.min(a.t+dt/a.dur,1);
    const e=a.t<0.5?4*a.t*a.t*a.t:1-Math.pow(-2*a.t+2,3)/2;   // easeInOutCubic
    qslerp(a.from,a.to,e,S.q);
    S.zoom=lerp(a.z0,a.z1,e);
    if(a.t>=1) S.anim=null;
    dirty=true;
    return;
  }
  if(S.dragging) return;

  const l=Math.hypot(S.omega[0],S.omega[1],S.omega[2]);
  if(l>1e-4){
    qnorm(qmul(qaxis(S.omega[0],S.omega[1],S.omega[2],l*dt,_dq),S.q,S.q));
    const d=Math.pow(0.5,dt/DAMP_HALFLIFE);
    S.omega[0]*=d; S.omega[1]*=d; S.omega[2]*=d;
    dirty=true;
  }
  if(S.spin){
    /* 自转绕地理南北轴，所以是世界空间增量：右乘 */
    qnorm(qmul(S.q,qaxis(0,1,0,IDLE_SPIN*dt,_dq),S.q));
    dirty=true;
  }
}

function updateInfo(fast){
  elZoom.textContent='×'+S.zoom.toFixed(2);
  elRead.classList.toggle('blur',fast);
  if(fast) return;
  const key=S.lon.toFixed(1)+','+S.lat.toFixed(1);
  if(key===lastKey) return;
  lastKey=key;
  const hemNS=S.lat>=0?'N':'S', hemEW=S.lon>=0?'E':'W';
  elCoord.textContent=Math.abs(S.lat).toFixed(1)+'°'+hemNS+'  '+Math.abs(S.lon).toFixed(1)+'°'+hemEW;
  const loc=locate(S.lon,S.lat);
  elPlace.innerHTML='';
  elPlace.appendChild(document.createTextNode(loc.name));
  if(loc.sub){
    const s=document.createElement('span');
    s.className='sub'; s.textContent=loc.sub;
    elPlace.appendChild(s);
  }
}

/*
 * 帧时调节器。素描的开销几乎全是填充像素，跟渲染密度的平方成正比，而不同
 * 机器差出一个数量级（本机是无 GPU 的软件光栅，最差情况）。与其我拍一个
 * 固定的折中值，不如看真实帧时自己找：转不动就降密度，有余量再升回去。
 * 停下来时上面会强制拉回满密度重画，所以「该看清的时候」始终是清楚的。
 */
const FT=[]; let ftI=0, coolDown=0;
function govern(dt,fast){
  FT[ftI++%12]=dt;
  if(coolDown>0){ coolDown-=dt; return; }
  if(FT.length<12) return;
  const s=FT.slice().sort((a,b)=>a-b), med=s[6];
  if(med>0.022&&RS>0.7){ setScale(RS-0.25); coolDown=0.4; }
  else if(med<0.013&&RS<DPR&&!fast){ setScale(RS+0.25); coolDown=0.6; }
}

function loop(now){
  const dt=clamp((now-lastT)/1000,0,0.05);
  lastT=now;

  step(dt);
  R=R0*S.zoom;
  qmat(S.q,M);

  /* 正对镜头的世界点 = Mᵀ·(0,0,1) = M 的第三行 */
  S.lat=Math.asin(clamp(M[7],-1,1))*R2D;
  S.lon=Math.atan2(M[6],M[8])*R2D;

  const spin=Math.hypot(S.omega[0],S.omega[1],S.omega[2]);
  const speed=spin+(S.spin?IDLE_SPIN:0);
  /* 转得快就走快通道：排线放稀、笔数减少 —— 既省算力，也恰好读作速度感 */
  const fast=S.dragging||speed>0.3;
  const changing=S.dragging||S.anim||S.spin||spin>1e-3||dirty;

  if(changing){
    govern(dt,fast);
    render(ctx,!fast);
    S.still=0; S.baked=false; dirty=false;
  } else {
    /* 完全静止：拉回满密度，精细重绘一次缓存起来，之后每帧只贴图 */
    S.still+=dt;
    if(S.still>0.14&&!S.baked){
      setScale(DPR);
      render(lctx,true);
      S.baked=true;
    }
    if(S.baked){ ctx.clearRect(0,0,W,H); ctx.drawImage(layer,0,0,W,H); }
  }

  infoT+=dt;
  if(infoT>0.1){ infoT=0; updateInfo(speed>1.6); }

  requestAnimationFrame(loop);
}

resize();
qLookAt(105,25,S.q);
updateInfo(false);
requestAnimationFrame(loop);
</script>
