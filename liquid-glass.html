<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e9e9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Liquid Glass</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: radial-gradient(130% 95% at 50% 36%, #f5f5f7 0%, #eaeaee 52%, #d8d8dd 100%);
  }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<svg id="s"></svg>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('s');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

function E(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function grad(defs, id, x1, y1, x2, y2, stops) {
  const g = E('linearGradient', { id, x1, y1, x2, y2, gradientUnits: 'userSpaceOnUse' }, defs);
  for (const s of stops) E('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, g);
}
function blurF(defs, id, d) {
  const f = E('filter', { id, x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
  E('feGaussianBlur', { stdDeviation: d }, f);
}

// Two tracks cross at the screen center like a subway junction. The lens
// is the draggable thumb, constrained to the cross; the liquid chases it
// on a softer spring, lighting the route from the left terminus.
let lensX, lensY, lensVX = 0, lensVY = 0, tX, tY;
let fillX, fillY, fillVX = 0, fillVY = 0, fillOnV = false;
let fdx = 0, fdy = 0, fdvx = 0, fdvy = 0, flip = -1, flipT = -1;   // the fish
let dragging = false, sx = 0, sy = 0, spX = 0, spY = 0;

let W, H, cx, cy, cx0, th, LW, LH, lx0, ly, LR, MXH, MTH, thM;
let XMIN, XMAX, YMIN, YMAX, edgeL, edgeR, edgeT, edgeB;
const U = {};                         // nodes updated every frame

function projCross(x, y, m) {
  // nearest point on the cross (m = extra overshoot margin for spring bounce)
  const onV = Math.abs(x - cx) < Math.abs(y - cy);
  return onV
    ? { x: cx, y: clamp(y, YMIN - m, YMAX + m), onV: true }
    : { x: clamp(x, XMIN - m, XMAX + m), y: cy, onV: false };
}

function build() {
  svg.innerHTML = '';
  W = innerWidth; H = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  cx = W / 2; cy = H / 2; cx0 = cx;                        // lens geometry is built centered,
  th = Math.max(10, Math.round(Math.min(W, H) * 0.031));   // then moved by a group transform
  LW = Math.min(W * 0.54, 250);
  LH = LW * 0.68;
  lx0 = cx0 - LW / 2; ly = cy - LH / 2; LR = LH * 0.42;
  MXH = 1.16; MTH = 3.0; thM = th * MTH;                   // along-axis / cross-axis magnification
  XMIN = LW / 2 + 8; XMAX = W - LW / 2 - 8;
  YMIN = LH / 2 + 64; YMAX = H - LH / 2 - 40;
  edgeL = lx0 + LH * 0.12; edgeR = lx0 + LW - LH * 0.12;
  edgeT = ly + LH * 0.12; edgeB = ly + LH - LH * 0.12;

  lensX = tX = clamp(lensX ?? cx, XMIN, XMAX);
  lensY = tY = clamp(lensY ?? cy, YMIN, YMAX);
  const p0 = projCross(lensX, lensY, 0);
  lensX = p0.x; lensY = p0.y;
  fillX = fillX ?? lensX; fillY = fillY ?? lensY;

  const defs = E('defs', {}, svg);

  const cp = E('clipPath', { id: 'lc' }, defs);
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR }, cp);

  grad(defs, 'gBlue', 0, cy - thM / 2, 0, cy + thM / 2, [[0, '#3f8cee'], [0.45, '#1266de'], [1, '#0d55c4']]);
  grad(defs, 'gBlueV', cx0 - thM / 2, 0, cx0 + thM / 2, 0, [[0, '#3f8cee'], [0.45, '#1266de'], [1, '#0d55c4']]);
  grad(defs, 'gBlueS', 0, cy - th / 2, 0, cy + th / 2, [[0, '#2f7fe8'], [1, '#0f5ccd']]);
  grad(defs, 'gBlueSV', cx - th / 2, 0, cx + th / 2, 0, [[0, '#2f7fe8'], [1, '#0f5ccd']]);
  grad(defs, 'gTrackM', 0, cy - thM / 2, 0, cy + thM / 2, [[0, '#d2d3d7'], [1, '#c3c4c9']]);
  grad(defs, 'gTrackMV', cx0 - thM / 2, 0, cx0 + thM / 2, 0, [[0, '#d2d3d7'], [1, '#c3c4c9']]);
  grad(defs, 'gRim', 0, ly, 0, ly + LH, [
    [0, '#fff', 0.95], [0.3, '#fff', 0.3], [0.7, '#fff', 0.22], [1, '#fff', 0.8]
  ]);
  grad(defs, 'gGlint', lx0 + LW * 0.42, 0, lx0 + LW * 0.85, 0, [
    [0, '#ffb27a', 0.9], [0.35, '#ffe27f', 0.9], [0.7, '#8fe6a8', 0.9], [1, '#7db5ff', 0.9]
  ]);
  grad(defs, 'gSheen', 0, ly, 0, ly + LH * 0.4, [[0, '#fff', 0.5], [1, '#fff', 0]]);
  grad(defs, 'gFish', 0, -17, 0, 17, [[0, '#ffa347'], [0.55, '#f57616'], [1, '#e05f07']]);

  blurF(defs, 'bFlare', LH * 0.045);
  blurF(defs, 'bFlareS', LH * 0.022);
  blurF(defs, 'bRing', LH * 0.038);
  blurF(defs, 'bSoft', 6);
  blurF(defs, 'bGlint', 1.3);

  // shadow-only filter (glass casts a shadow but stays transparent)
  const fs = E('filter', { id: 'fSh', x: '-60%', y: '-60%', width: '220%', height: '260%' }, defs);
  E('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: 20, result: 'b1' }, fs);
  E('feOffset', { in: 'b1', dy: 18, result: 'o1' }, fs);
  E('feColorMatrix', { in: 'o1', type: 'matrix', result: 's1',
    values: '0 0 0 0 0.13  0 0 0 0 0.14  0 0 0 0 0.18  0 0 0 0.28 0' }, fs);
  E('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: 6, result: 'b2' }, fs);
  E('feOffset', { in: 'b2', dy: 5, result: 'o2' }, fs);
  E('feColorMatrix', { in: 'o2', type: 'matrix', result: 's2',
    values: '0 0 0 0 0.13  0 0 0 0 0.14  0 0 0 0 0.18  0 0 0 0.16 0' }, fs);
  const mg = E('feMerge', {}, fs);
  E('feMergeNode', { in: 's1' }, mg);
  E('feMergeNode', { in: 's2' }, mg);

  // mask: keep the shadow outside the glass so the interior stays clear
  // (oversized so it still covers the viewport wherever the lens slides)
  const mk = E('mask', { id: 'mOut', maskUnits: 'userSpaceOnUse', x: -W, y: -H, width: 3 * W, height: 3 * H }, defs);
  E('rect', { x: -W, y: -H, width: 3 * W, height: 3 * H, fill: '#fff' }, mk);
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR, fill: '#000' }, mk);

  // ---- base scene: the crossing tracks (fixed to the screen) ----
  const gScene = E('g', {}, svg);
  E('rect', { x: -4, y: cy - th / 2, width: W + 8, height: th, fill: '#c8c9cd' }, gScene);
  E('rect', { x: cx - th / 2, y: -4, width: th, height: H + 8, fill: '#c8c9cd' }, gScene);
  U.routeH = E('path', { fill: 'none', stroke: 'url(#gBlueS)', 'stroke-width': th, 'stroke-linecap': 'round' }, gScene);
  U.routeV = E('path', { fill: 'none', stroke: 'url(#gBlueSV)', 'stroke-width': th, 'stroke-linecap': 'round' }, gScene);

  // ---- glass shadow ----
  U.gShadow = E('g', { mask: 'url(#mOut)' }, svg);
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR, fill: '#000', filter: 'url(#fSh)' }, U.gShadow);

  // ---- magnified content inside the lens ----
  U.gMag = E('g', { 'clip-path': 'url(#lc)' }, svg);
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR, fill: '#fff', opacity: 0.02 }, U.gMag);
  U.mTrackH = E('path', { fill: 'none', stroke: 'url(#gTrackM)' }, U.gMag);
  U.mTrackV = E('path', { fill: 'none', stroke: 'url(#gTrackMV)' }, U.gMag);
  U.mFillH = E('path', { fill: 'none', stroke: 'url(#gBlue)', 'stroke-linecap': 'round' }, U.gMag);
  U.mFillV = E('path', { fill: 'none', stroke: 'url(#gBlueV)', 'stroke-linecap': 'round' }, U.gMag);

  // refraction flares at the four lens edges
  const flare = (x, y, rx, ry, color, f) =>
    E('ellipse', { cx: x, cy: y, rx, ry, fill: color, filter: `url(#${f})`, opacity: 0 }, U.gMag);
  U.flGrayL = flare(lx0 + LH * 0.07, cy, LH * 0.09, LH * 0.33, '#bdbec3', 'bFlare');
  U.flGrayR = flare(lx0 + LW - LH * 0.07, cy, LH * 0.09, LH * 0.33, '#bdbec3', 'bFlare');
  U.flBlueL = flare(lx0 + LH * 0.07, cy, LH * 0.09, LH * 0.33, '#1266de', 'bFlare');
  U.flBlueL2 = flare(lx0 + LH * 0.045, cy, LH * 0.09, LH * 0.24, '#5aa8ff', 'bFlareS');
  U.flBlueR = flare(lx0 + LW - LH * 0.07, cy, LH * 0.09, LH * 0.33, '#1266de', 'bFlare');
  U.flBlueR2 = flare(lx0 + LW - LH * 0.045, cy, LH * 0.09, LH * 0.24, '#5aa8ff', 'bFlareS');
  U.flGrayT = flare(cx0, ly + LH * 0.07, LH * 0.24, LH * 0.09, '#bdbec3', 'bFlare');
  U.flGrayB = flare(cx0, ly + LH - LH * 0.07, LH * 0.24, LH * 0.09, '#bdbec3', 'bFlare');
  U.flBlueT = flare(cx0, ly + LH * 0.07, LH * 0.24, LH * 0.09, '#1266de', 'bFlare');
  U.flBlueT2 = flare(cx0, ly + LH * 0.045, LH * 0.17, LH * 0.09, '#5aa8ff', 'bFlareS');
  U.flBlueB = flare(cx0, ly + LH - LH * 0.07, LH * 0.24, LH * 0.09, '#1266de', 'bFlare');
  U.flBlueB2 = flare(cx0, ly + LH - LH * 0.045, LH * 0.17, LH * 0.09, '#5aa8ff', 'bFlareS');

  // ---- the resident clownfish, at home in the right half of the bubble ----
  // (drawn under the glass shading so it reads as swimming inside)
  const fu = LW / 235;
  const cpF = E('clipPath', { id: 'fbc' }, defs);
  E('ellipse', { cx: 0, cy: 0, rx: 31, ry: 17 }, cpF);
  U.gFish = E('g', {}, U.gMag);
  const gF = E('g', { transform: `scale(${fu})` }, U.gFish);
  U.fishTail = E('g', {}, gF);
  E('path', { d: 'M -24 0 C -31 -12 -44 -15 -48 -10 C -44 -5 -44 5 -48 10 C -44 15 -31 12 -24 0 Z',
    fill: '#f97c1d', stroke: 'rgba(160,70,0,0.35)', 'stroke-width': 1 }, U.fishTail);
  E('path', { d: 'M -14 -14 C -9 -24 6 -25 12 -17 C 2 -18 -8 -16 -14 -14 Z', fill: '#ef6c0f' }, gF);
  E('path', { d: 'M -6 14 C -2 20 6 21 10 17 C 5 15 0 14 -6 14 Z', fill: '#ef6c0f' }, gF);
  E('ellipse', { cx: 0, cy: 0, rx: 31, ry: 17, fill: 'url(#gFish)',
    stroke: 'rgba(150,60,0,0.35)', 'stroke-width': 1 }, gF);
  const gS = E('g', { 'clip-path': 'url(#fbc)' }, gF);
  E('rect', { x: 10, y: -18, width: 9, height: 36, fill: '#fbfbf8', stroke: 'rgba(40,40,40,0.4)', 'stroke-width': 1.1 }, gS);
  E('rect', { x: -9, y: -18, width: 10, height: 36, fill: '#fbfbf8', stroke: 'rgba(40,40,40,0.4)', 'stroke-width': 1.1 }, gS);
  E('rect', { x: -27, y: -18, width: 7, height: 36, fill: '#fbfbf8', stroke: 'rgba(40,40,40,0.4)', 'stroke-width': 1.1 }, gS);
  U.fishFin = E('path', { d: 'M 2 1 C 9 4 12 9 8 13 C 4 10 2 6 2 1 Z', fill: '#ff9a3d', opacity: 0.95 }, gF);
  E('circle', { cx: 20, cy: -5, r: 3.6, fill: '#fff' }, gF);
  E('circle', { cx: 20.8, cy: -5, r: 2, fill: '#1d1d1f' }, gF);
  E('circle', { cx: 21.4, cy: -5.8, r: 0.7, fill: '#fff' }, gF);

  // dark refraction ring hugging the inside of the glass
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR, fill: 'none',
    stroke: 'rgba(50,62,88,0.18)', 'stroke-width': LH * 0.09, filter: 'url(#bRing)' }, U.gMag);
  // bright inner line (glass thickness)
  const i1 = LH * 0.05;
  E('rect', { x: lx0 + i1, y: ly + i1, width: LW - 2 * i1, height: LH - 2 * i1, rx: LR - i1, fill: 'none',
    stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 2, filter: 'url(#bSoft)', opacity: 0.4 }, U.gMag);

  // ---- glass surface overlays ----
  U.gGlass = E('g', {}, svg);
  const gi = E('g', { 'clip-path': 'url(#lc)' }, U.gGlass);
  E('ellipse', { cx: cx0, cy: ly + LH * 0.12, rx: LW * 0.3, ry: LH * 0.07, fill: 'url(#gSheen)',
    filter: 'url(#bSoft)', opacity: 0.3 }, gi);
  E('ellipse', { cx: cx0, cy: ly + LH * 0.94, rx: LW * 0.3, ry: LH * 0.06, fill: '#fff',
    filter: 'url(#bSoft)', opacity: 0.16 }, gi);
  E('path', { d: `M ${cx0 - LW * 0.04} ${ly + LH - 1.2} Q ${cx0 + LW * 0.22} ${ly + LH + 1} ${cx0 + LW * 0.34} ${ly + LH * 0.86}`,
    fill: 'none', stroke: 'url(#gGlint)', 'stroke-width': 2.6, 'stroke-linecap': 'round',
    filter: 'url(#bGlint)', opacity: 0.75 }, gi);
  E('rect', { x: lx0, y: ly, width: LW, height: LH, rx: LR, fill: 'none',
    stroke: 'url(#gRim)', 'stroke-width': 1.6 }, U.gGlass);
}

function frame(now) {
  const dt = Math.min(0.032, (now - (frame.t || now)) / 1000 || 0.016);
  frame.t = now;

  // lens spring — tight under the finger, bouncy on release
  const k1 = dragging ? 420 : 170;
  const c1 = dragging ? 36 : 12;
  lensVX += (k1 * (tX - lensX) - c1 * lensVX) * dt;
  lensVY += (k1 * (tY - lensY) - c1 * lensVY) * dt;
  const lp = projCross(lensX + lensVX * dt, lensY + lensVY * dt, 30);
  lensX = lp.x; lensY = lp.y;

  // liquid spring — softer, so it lags and sloshes after the lens
  fillVX += (150 * (lensX - fillX) - 10 * fillVX) * dt;
  fillVY += (150 * (lensY - fillY) - 10 * fillVY) * dt;
  const fp = projCross(fillX + fillVX * dt, fillY + fillVY * dt, 30);
  fillX = fp.x; fillY = fp.y;
  fillOnV = fp.onV;

  // blend of magnification axes: 0 = on the horizontal track, 1 = vertical
  const b = clamp(0.5 + (Math.abs(lensY - cy) - Math.abs(lensX - cx)) / 40, 0, 1);
  const MX = lerp(MXH, MTH, b);       // horizontal magnification
  const MY = lerp(MTH, MXH, b);       // vertical magnification
  const mapX = x => cx0 + (x - lensX) * MX;
  const mapY = y => cy + (y - lensY) * MY;

  // route: left terminus -> junction -> chosen branch (screen space)
  const hx = fillOnV ? cx : fillX;
  U.routeH.setAttribute('d', `M ${-th} ${cy} L ${hx} ${cy}`);
  U.routeV.setAttribute('d', fillOnV ? `M ${cx} ${cy} L ${cx} ${fillY}` : 'M -10 -10');

  // magnified cross inside the lens
  const yH = mapY(cy), xV = mapX(cx);
  const wH = th * MY, wV = th * MX;
  U.mTrackH.setAttribute('d', `M ${lx0 - 140} ${yH} L ${lx0 + LW + 140} ${yH}`);
  U.mTrackH.setAttribute('stroke-width', wH);
  U.mTrackV.setAttribute('d', `M ${xV} ${ly - 140} L ${xV} ${ly + LH + 140}`);
  U.mTrackV.setAttribute('stroke-width', wV);
  const hEnd = mapX(hx);
  U.mFillH.setAttribute('d', `M ${lx0 - 200} ${yH} L ${hEnd} ${yH}`);
  U.mFillH.setAttribute('stroke-width', wH);
  U.mFillV.setAttribute('d', fillOnV ? `M ${xV} ${mapY(cy)} L ${xV} ${mapY(fillY)}` : 'M -10 -10');
  U.mFillV.setAttribute('stroke-width', wV);

  // edge flares: visible only where the bar actually crosses the glass edge
  const fH = clamp((LH * 0.55 - Math.abs(yH - cy)) / (LH * 0.2), 0, 1);
  const fV = clamp((LW * 0.55 - Math.abs(xV - cx0)) / (LW * 0.2), 0, 1);
  const oL = clamp((hEnd - edgeL) / (LH * 0.25), 0, 1);
  const oR = clamp((hEnd - edgeR) / (LH * 0.25), 0, 1);
  // vertical blue runs between the junction and the liquid end; an edge
  // glows blue only if that segment actually crosses it
  let oT = 0, oB = 0;
  if (fillOnV) {
    const yJ = mapY(cy), vEnd = mapY(fillY);
    const yA = Math.min(yJ, vEnd), yB = Math.max(yJ, vEnd);
    oT = clamp((edgeT - yA) / (LH * 0.25), 0, 1) * clamp((yB - edgeT) / (LH * 0.25), 0, 1);
    oB = clamp((edgeB - yA) / (LH * 0.25), 0, 1) * clamp((yB - edgeB) / (LH * 0.25), 0, 1);
  }
  U.flBlueL.setAttribute('opacity', oL * 0.85 * fH);
  U.flBlueL2.setAttribute('opacity', oL * 0.55 * fH);
  U.flBlueR.setAttribute('opacity', oR * 0.85 * fH);
  U.flBlueR2.setAttribute('opacity', oR * 0.55 * fH);
  U.flGrayL.setAttribute('opacity', (1 - oL) * 0.4 * fH);
  U.flGrayR.setAttribute('opacity', (1 - oR) * 0.4 * fH);
  U.flBlueT.setAttribute('opacity', oT * 0.85 * fV);
  U.flBlueT2.setAttribute('opacity', oT * 0.55 * fV);
  U.flBlueB.setAttribute('opacity', oB * 0.85 * fV);
  U.flBlueB2.setAttribute('opacity', oB * 0.55 * fV);
  U.flGrayT.setAttribute('opacity', (1 - oT) * 0.4 * fV);
  U.flGrayB.setAttribute('opacity', (1 - oB) * 0.4 * fV);

  // clownfish: water drag pulls it against the motion, it turns to face
  // where it's headed, and wags harder the faster the bubble moves
  const tfx = clamp(-lensVX * 0.05, -LW * 0.09, LW * 0.09);
  const tfy = clamp(-lensVY * 0.05, -LH * 0.10, LH * 0.10);
  fdvx += (80 * (tfx - fdx) - 10 * fdvx) * dt; fdx += fdvx * dt;
  fdvy += (80 * (tfy - fdy) - 10 * fdvy) * dt; fdy += fdvy * dt;
  if (lensVX > 60) flipT = 1; else if (lensVX < -60) flipT = -1;
  flip += (flipT - flip) * Math.min(1, dt * 7);
  const tilt = clamp(lensVY * 0.04, -22, 22) * flip;
  const bobX = Math.sin(now * 0.0009) * 3;
  const bobY = Math.sin(now * 0.0016) * 2.5;
  U.gFish.setAttribute('transform',
    `translate(${(cx0 + LW * 0.27 + fdx + bobX).toFixed(2)} ${(cy + fdy + bobY).toFixed(2)}) ` +
    `rotate(${tilt.toFixed(1)}) scale(${flip.toFixed(3)} 1)`);
  const wag = Math.sin(now * 0.009) * (9 + clamp(Math.hypot(lensVX, lensVY) * 0.04, 0, 14));
  U.fishTail.setAttribute('transform', `rotate(${wag.toFixed(1)} -24 0)`);
  U.fishFin.setAttribute('transform', `rotate(${(-wag * 0.7).toFixed(1)} 3 3)`);

  // soft squash along the direction of motion, about the lens center
  const qh = clamp(Math.abs(lensVX) * 0.00022, 0, 0.05);
  const qv = clamp(Math.abs(lensVY) * 0.00022, 0, 0.05);
  const sX = ((1 - qh) * (1 + qv * 0.7)).toFixed(4);
  const sY = ((1 + qh * 0.7) * (1 - qv)).toFixed(4);
  const dx = (lensX - cx0).toFixed(2), dy = (lensY - cy).toFixed(2);
  const tf = `translate(${dx} ${dy}) translate(${cx0} ${cy}) scale(${sX} ${sY}) translate(${-cx0} ${-cy})`;
  U.gShadow.setAttribute('transform', tf);
  U.gMag.setAttribute('transform', tf);
  U.gGlass.setAttribute('transform', tf);

  requestAnimationFrame(frame);
}

svg.addEventListener('pointerdown', e => {
  dragging = true; sx = e.clientX; sy = e.clientY; spX = tX; spY = tY;
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  let vx = spX + (e.clientX - sx);
  let vy = spY + (e.clientY - sy);
  vx = vx < XMIN ? XMIN + (vx - XMIN) * 0.35 : vx > XMAX ? XMAX + (vx - XMAX) * 0.35 : vx;
  vy = vy < YMIN ? YMIN + (vy - YMIN) * 0.35 : vy > YMAX ? YMAX + (vy - YMAX) * 0.35 : vy;
  const t = projCross(vx, vy, 0);
  tX = t.x; tY = t.y;
});
const release = () => {
  dragging = false;
  const t = projCross(tX, tY, 0);
  tX = t.x; tY = t.y;
};
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', release);
addEventListener('resize', build);

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
