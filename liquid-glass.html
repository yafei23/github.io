<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e9e9ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Liquid Glass</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: radial-gradient(130% 95% at 50% 36%, #f5f5f7 0%, #eaeaee 52%, #d8d8dd 100%);
  }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<svg id="s"></svg>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('s');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function E(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
function grad(defs, id, x1, y1, x2, y2, stops) {
  const g = E('linearGradient', { id, x1, y1, x2, y2, gradientUnits: 'userSpaceOnUse' }, defs);
  for (const s of stops) E('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] == null ? 1 : s[2] }, g);
}
function blurF(defs, id, d) {
  const f = E('filter', { id, x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
  E('feGaussianBlur', { stdDeviation: d }, f);
}

// state: target follows the finger, pd is the displayed (spring) value
let target = 0.55, pd = 0.55, vel = 0;
let loff = 0, lvel = 0;              // lens lean offset
let dragging = false, sx = 0, sp = 0;

let W, H, cx, cy, th, LW, LH, lx, ly, LR, Mx, My, thM, fillX0, edgeL, edgeR;
const U = {};                        // nodes updated every frame

function build() {
  svg.innerHTML = '';
  W = innerWidth; H = innerHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  cx = W / 2; cy = H / 2;
  th = Math.max(10, Math.round(Math.min(W, H) * 0.031));   // bar thickness
  LW = Math.min(W * 0.78, 340);                            // lens size
  LH = LW * 0.68;
  lx = cx - LW / 2; ly = cy - LH / 2; LR = LH * 0.42;
  Mx = 1.16; My = 3.0; thM = th * My;                      // magnification
  fillX0 = cx * (1 - Mx) - 60;
  edgeL = lx + LH * 0.12; edgeR = lx + LW - LH * 0.12;

  const defs = E('defs', {}, svg);

  // lens clip
  const cp = E('clipPath', { id: 'lc' }, defs);
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR }, cp);

  grad(defs, 'gBlue', 0, cy - thM / 2, 0, cy + thM / 2, [[0, '#3f8cee'], [0.45, '#1266de'], [1, '#0d55c4']]);
  grad(defs, 'gBlueS', 0, cy - th / 2, 0, cy + th / 2, [[0, '#2f7fe8'], [1, '#0f5ccd']]);
  grad(defs, 'gTrackM', 0, cy - thM / 2, 0, cy + thM / 2, [[0, '#d2d3d7'], [1, '#c3c4c9']]);
  grad(defs, 'gRim', 0, ly, 0, ly + LH, [
    [0, '#fff', 0.95], [0.3, '#fff', 0.3], [0.7, '#fff', 0.22], [1, '#fff', 0.8]
  ]);
  grad(defs, 'gGlint', lx + LW * 0.42, 0, lx + LW * 0.85, 0, [
    [0, '#ffb27a', 0.9], [0.35, '#ffe27f', 0.9], [0.7, '#8fe6a8', 0.9], [1, '#7db5ff', 0.9]
  ]);
  grad(defs, 'gSheen', 0, ly, 0, ly + LH * 0.4, [[0, '#fff', 0.5], [1, '#fff', 0]]);

  blurF(defs, 'bFlare', LH * 0.045);
  blurF(defs, 'bFlareS', LH * 0.022);
  blurF(defs, 'bRing', LH * 0.038);
  blurF(defs, 'bSoft', 6);
  blurF(defs, 'bGlint', 1.3);

  // shadow-only filter (glass casts a shadow but stays transparent)
  const fs = E('filter', { id: 'fSh', x: '-60%', y: '-60%', width: '220%', height: '260%' }, defs);
  E('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: 20, result: 'b1' }, fs);
  E('feOffset', { in: 'b1', dy: 18, result: 'o1' }, fs);
  E('feColorMatrix', { in: 'o1', type: 'matrix', result: 's1',
    values: '0 0 0 0 0.13  0 0 0 0 0.14  0 0 0 0 0.18  0 0 0 0.28 0' }, fs);
  E('feGaussianBlur', { in: 'SourceAlpha', stdDeviation: 6, result: 'b2' }, fs);
  E('feOffset', { in: 'b2', dy: 5, result: 'o2' }, fs);
  E('feColorMatrix', { in: 'o2', type: 'matrix', result: 's2',
    values: '0 0 0 0 0.13  0 0 0 0 0.14  0 0 0 0 0.18  0 0 0 0.16 0' }, fs);
  const mg = E('feMerge', {}, fs);
  E('feMergeNode', { in: 's1' }, mg);
  E('feMergeNode', { in: 's2' }, mg);

  // mask: keep the shadow outside the glass so the interior stays clear
  const mk = E('mask', { id: 'mOut', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, defs);
  E('rect', { x: 0, y: 0, width: W, height: H, fill: '#fff' }, mk);
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR, fill: '#000' }, mk);

  // ---- base scene: the bar ----
  const gScene = E('g', {}, svg);
  E('rect', { x: -4, y: cy - th / 2, width: W + 8, height: th, fill: '#c8c9cd' }, gScene);
  U.fill = E('rect', { x: -th, y: cy - th / 2, width: th, height: th, rx: th / 2, fill: 'url(#gBlueS)' }, gScene);

  // ---- glass shadow ----
  U.gShadow = E('g', { mask: 'url(#mOut)' }, svg);
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR, fill: '#000', filter: 'url(#fSh)' }, U.gShadow);

  // ---- magnified content inside the lens ----
  U.gMag = E('g', { 'clip-path': 'url(#lc)' }, svg);
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR, fill: '#fff', opacity: 0.02 }, U.gMag);
  E('rect', { x: fillX0, y: cy - thM / 2, width: W * Mx + 120, height: thM, fill: 'url(#gTrackM)' }, U.gMag);
  U.fillM = E('rect', { x: fillX0, y: cy - thM / 2, width: 0, height: thM, rx: thM / 2, fill: 'url(#gBlue)' }, U.gMag);

  // refraction flares at the lens edges (gray when track crosses, blue when fill covers)
  const flare = (x, color, f) =>
    E('ellipse', { cx: x, cy, rx: LH * 0.09, ry: LH * 0.33, fill: color, filter: `url(#${f})`, opacity: 0 }, U.gMag);
  U.flGrayL = flare(lx + LH * 0.07, '#bdbec3', 'bFlare');
  U.flGrayR = flare(lx + LW - LH * 0.07, '#bdbec3', 'bFlare');
  U.flBlueL = flare(lx + LH * 0.07, '#1266de', 'bFlare');
  U.flBlueL2 = flare(lx + LH * 0.045, '#5aa8ff', 'bFlareS');
  U.flBlueR = flare(lx + LW - LH * 0.07, '#1266de', 'bFlare');
  U.flBlueR2 = flare(lx + LW - LH * 0.045, '#5aa8ff', 'bFlareS');
  U.flBlueL2.setAttribute('ry', LH * 0.24);
  U.flBlueR2.setAttribute('ry', LH * 0.24);

  // dark refraction ring hugging the inside of the glass
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR, fill: 'none',
    stroke: 'rgba(50,62,88,0.18)', 'stroke-width': LH * 0.09, filter: 'url(#bRing)' }, U.gMag);
  // bright inner line (glass thickness)
  const i1 = LH * 0.05;
  E('rect', { x: lx + i1, y: ly + i1, width: LW - 2 * i1, height: LH - 2 * i1, rx: LR - i1, fill: 'none',
    stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 2, filter: 'url(#bSoft)', opacity: 0.4 }, U.gMag);

  // ---- glass surface overlays ----
  U.gGlass = E('g', {}, svg);
  const gi = E('g', { 'clip-path': 'url(#lc)' }, U.gGlass);
  E('ellipse', { cx, cy: ly + LH * 0.12, rx: LW * 0.3, ry: LH * 0.07, fill: 'url(#gSheen)',
    filter: 'url(#bSoft)', opacity: 0.3 }, gi);
  E('ellipse', { cx, cy: ly + LH * 0.94, rx: LW * 0.3, ry: LH * 0.06, fill: '#fff',
    filter: 'url(#bSoft)', opacity: 0.16 }, gi);
  E('path', { d: `M ${cx - LW * 0.04} ${ly + LH - 1.2} Q ${cx + LW * 0.22} ${ly + LH + 1} ${cx + LW * 0.34} ${ly + LH * 0.86}`,
    fill: 'none', stroke: 'url(#gGlint)', 'stroke-width': 2.6, 'stroke-linecap': 'round',
    filter: 'url(#bGlint)', opacity: 0.75 }, gi);
  E('rect', { x: lx, y: ly, width: LW, height: LH, rx: LR, fill: 'none',
    stroke: 'url(#gRim)', 'stroke-width': 1.6 }, U.gGlass);
}

function frame(now) {
  const dt = Math.min(0.032, (now - (frame.t || now)) / 1000 || 0.016);
  frame.t = now;

  // spring toward target — snappy while dragging, jelly bounce on release
  const k = dragging ? 320 : 130;
  const c = dragging ? 30 : 9.5;
  vel += (k * (target - pd) - c * vel) * dt;
  pd += vel * dt;

  // lens leans slightly toward the motion
  const lt = clamp((target - pd) * LW * 0.3, -10, 10);
  lvel += (240 * (lt - loff) - 22 * lvel) * dt;
  loff += lvel * dt;

  const end = pd * W;
  U.fill.setAttribute('width', Math.max(th, end + th));

  const endM = cx + (end - cx) * Mx;
  U.fillM.setAttribute('width', Math.max(0, endM - fillX0));

  const oL = clamp((endM - edgeL) / (LH * 0.25), 0, 1);
  const oR = clamp((endM - edgeR) / (LH * 0.25), 0, 1);
  U.flBlueL.setAttribute('opacity', oL * 0.85);
  U.flBlueL2.setAttribute('opacity', oL * 0.55);
  U.flBlueR.setAttribute('opacity', oR * 0.85);
  U.flBlueR2.setAttribute('opacity', oR * 0.55);
  U.flGrayL.setAttribute('opacity', (1 - oL) * 0.4);
  U.flGrayR.setAttribute('opacity', (1 - oR) * 0.4);

  const tf = `translate(${loff.toFixed(2)} 0)`;
  U.gShadow.setAttribute('transform', tf);
  U.gMag.setAttribute('transform', tf);
  U.gGlass.setAttribute('transform', tf);

  requestAnimationFrame(frame);
}

svg.addEventListener('pointerdown', e => {
  dragging = true; sx = e.clientX; sp = target;
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const raw = sp + (e.clientX - sx) / W * 1.15;
  target = raw < 0 ? raw * 0.3 : raw > 1 ? 1 + (raw - 1) * 0.3 : raw;   // rubber band past the ends
});
const release = () => { dragging = false; target = clamp(target, 0, 1); };
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', release);
addEventListener('resize', build);

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
