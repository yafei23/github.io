<title>楼顶庭院灯光沙盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
:root{
  --ground:#0b0e12; --panel:rgba(14,17,22,.9); --raise:#161a20; --raise-2:#1d2229;
  --line:#242b33; --line-2:#333c46;
  --ink:#ece8e0; --ink-2:#a9b1ba; --ink-3:#727c87;
  --amber:#f0ad4e; --amber-ink:#f5c27a; --amber-glow:rgba(240,173,78,.6);
  --cold:#dbe8ff; --cold-glow:rgba(205,225,255,.55);
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --serif:'Noto Serif SC','Songti SC','STSong',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

.scrim{position:fixed;pointer-events:none}
.scrim.tl{left:0;top:0;width:600px;height:190px;background:radial-gradient(ellipse at 0 0,rgba(8,10,14,.66),rgba(8,10,14,0) 70%)}
.scrim.bl{left:0;bottom:0;width:640px;height:280px;background:radial-gradient(ellipse at 0 100%,rgba(8,10,14,.74),rgba(8,10,14,0) 70%)}
.title{position:fixed;left:22px;top:18px;pointer-events:none;max-width:min(430px,calc(100vw - 360px))}
.title .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3)}
.title h1{font-family:var(--serif);font-weight:700;font-size:27px;letter-spacing:.05em;margin:7px 0 6px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.title .hint{margin:0;font-size:12px;color:var(--ink-2);text-shadow:0 1px 8px rgba(0,0,0,.8)}

.panel{position:fixed;top:14px;right:14px;bottom:14px;width:300px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.pscroll{flex:1;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:#2c343d transparent}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:8px}
.lbl span{font-family:var(--sans);letter-spacing:.02em;font-size:11px}
.more{display:none}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;background:var(--raise);border:1px solid var(--line);border-radius:7px}
.seg button{background:transparent;border:0;border-radius:5px;padding:7px 0;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raise-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:60px;padding:10px 10px 8px;text-align:left;
  background:var(--raise);border:1px solid var(--line);border-radius:7px;transition:border-color .2s,background .2s}
.key:hover{border-color:var(--line-2)}
.key .kn{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.04em}
.key .kw{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.key::after{content:"";position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#2c333b;transition:background .2s,box-shadow .2s}
.key[aria-pressed="true"]{border-color:rgba(240,173,78,.55);background:linear-gradient(180deg,#241b10,#18140f)}
.key[aria-pressed="true"]::after{background:var(--amber);box-shadow:0 0 9px 2px var(--amber-glow)}
.key.cold[aria-pressed="true"]{border-color:rgba(205,225,255,.45);background:linear-gradient(180deg,#18212c,#131921)}
.key.cold[aria-pressed="true"]::after{background:var(--cold);box-shadow:0 0 9px 2px var(--cold-glow)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{padding:7px 0;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--ink-2);font-size:12.5px}
.btn:hover{color:var(--ink);border-color:var(--line-2)}
.btn[aria-pressed="true"]{color:var(--ink);border-color:var(--line-2);background:var(--raise-2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opts .btn{display:flex;align-items:center;justify-content:center;gap:7px}
.opts .btn i{width:7px;height:7px;border-radius:50%;background:#2c333b}
.opts .btn[aria-pressed="true"] i{background:var(--amber);box-shadow:0 0 7px 1px var(--amber-glow)}

.fx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.fx button{width:100%;display:grid;grid-template-columns:8px 22px 1fr auto;align-items:center;gap:9px;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);text-align:left}
.fx button:hover{background:var(--raise)}
.fx .led{width:7px;height:7px;border-radius:50%;background:#2b323a;transition:background .2s,box-shadow .2s}
.fx button[aria-pressed="true"]{color:var(--ink)}
.fx button[aria-pressed="true"] .led{background:var(--amber);box-shadow:0 0 7px 1px var(--amber-glow)}
.fx button.cold[aria-pressed="true"] .led{background:var(--cold);box-shadow:0 0 7px 1px var(--cold-glow)}
.no{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(240,173,78,.55);color:var(--amber-ink);font-family:var(--mono);font-size:10.5px}
.fx .cold .no{border-color:rgba(205,225,255,.5);color:var(--cold)}
.fx .nm{font-size:13px;line-height:1.3}
.fx .nm small{display:block;font-size:10.5px;color:var(--ink-3)}
.fx .w{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.fx .w b{display:block;font-weight:400;color:var(--ink-3);opacity:.8}
body.day .fx button[aria-pressed="true"] .led{background:#5a4a33;box-shadow:none}

.meter{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.meter .big{font-family:var(--mono);font-size:25px;font-weight:500;color:var(--amber-ink);font-variant-numeric:tabular-nums;line-height:1}
.meter .big small{font-size:12px;color:var(--ink-3);margin-left:3px}
.meter .sub{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.55;font-variant-numeric:tabular-nums}

.caption{position:fixed;left:22px;bottom:22px;max-width:min(430px,calc(100vw - 370px));pointer-events:none}
.caption .cn{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.04em;margin-bottom:5px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.caption p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2);text-shadow:0 1px 10px rgba(0,0,0,.9)}
.caption .fact{margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--amber-ink);font-variant-numeric:tabular-nums}
.caption.cold .fact{color:var(--cold)}

.legend{position:fixed;left:22px;bottom:150px;width:320px;padding:11px 13px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.legend .lh{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:8px}
.legend .lh span{color:var(--ink-3);font-size:11px}
.legend .bar{height:10px;border-radius:2px;background:linear-gradient(90deg,#0d1024 0%,#1d2a7a 12.5%,#1f5fc8 25%,#1fa4c9 37.5%,#35b86a 50%,#b9cf3a 62.5%,#f0a032 75%,#e2452f 87.5%,#ffd9d0 100%)}
.legend .tk{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.legend p{margin:8px 0 0;font-size:11px;color:var(--ink-2);line-height:1.55}

#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.t3{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;padding:0;border-radius:50%;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(240,173,78,.75);background:rgba(10,12,16,.72);
  color:var(--amber-ink);font-family:var(--mono);font-size:10.5px;will-change:transform;transition:background .2s,color .2s}
.t3[aria-pressed="true"]{background:var(--amber);color:#1c1306;border-color:var(--amber)}
.t3.cold{border-color:rgba(205,225,255,.75);color:var(--cold)}
.t3.cold[aria-pressed="true"]{background:var(--cold);color:#0f1621}
.t3.hl{box-shadow:0 0 0 4px rgba(240,173,78,.25)}
body.notags #tags{display:none}

.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--ground);color:var(--ink-2);font-size:13px;transition:opacity .6s}
.loading b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600}
.loading.done{opacity:0;pointer-events:none}
.loading span{max-width:28em;text-align:center;line-height:1.7;padding:0 24px}

@media (max-width:760px){
  .title{left:14px;top:12px;max-width:calc(100vw - 28px)}
  .title h1{font-size:20px;margin:4px 0 2px}
  .title .hint{display:none}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh}
  .pscroll{padding:12px 12px 8px;gap:14px}
  .panel.min .x{display:none}
  .more{display:block;width:100%;padding:8px 0;background:transparent;border:0;border-top:1px solid var(--line);color:var(--ink-2);font-size:12.5px}
  .meter{padding:9px 14px 10px}
  .meter .big{font-size:20px}
  .caption{left:14px;right:14px;top:62px;bottom:auto;max-width:none}
  .caption p{display:none}
  .legend{left:14px;right:14px;top:120px;bottom:auto;width:auto}
  .keys{grid-template-columns:repeat(6,minmax(76px,1fr));overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<canvas id="c" aria-label="楼顶庭院三维模型，可拖动旋转"></canvas>
<div class="scrim tl"></div><div class="scrim bl"></div>
<div id="tags"></div>

<header class="title">
  <div class="kicker">三维预览 · 按你的模型比例搭建</div>
  <h1>楼顶庭院灯光沙盘</h1>
  <p class="hint">拖动旋转 · 滚轮缩放 · 右键拖动平移 · 点场景里的圆圈编号单独开关</p>
</header>

<aside class="panel min" id="panel">
  <div class="pscroll">
    <section>
      <div class="lbl">场景</div>
      <div class="keys" id="scenes"></div>
    </section>
    <section class="x">
      <div class="lbl">时间</div>
      <div class="seg" id="time">
        <button data-t="day" aria-pressed="false">白天</button>
        <button data-t="dusk" aria-pressed="false">黄昏</button>
        <button data-t="night" aria-pressed="true">夜晚</button>
      </div>
    </section>
    <section class="x">
      <div class="lbl">视角</div>
      <div class="grid3" id="views"></div>
    </section>
    <section class="x">
      <div class="lbl">显示</div>
      <div class="opts">
        <button class="btn" id="optTags" aria-pressed="true"><i></i>灯具编号</button>
        <button class="btn" id="optFalse" aria-pressed="false"><i></i>照度伪色</button>
      </div>
    </section>
    <section class="x">
      <div class="lbl">灯具 <span>点一行单独开关</span></div>
      <ul class="fx" id="fx"></ul>
    </section>
  </div>
  <button class="more" id="more" aria-expanded="false">更多控制 ▾</button>
  <footer class="meter">
    <div class="big" id="mW">81<small>W</small></div>
    <div class="sub" id="mSub">市电功率<br>≈ 9 000 lm · 9 组亮</div>
  </footer>
</aside>

<div class="caption" id="caption">
  <div class="cn" id="capN">聚会</div>
  <p id="capD"></p>
  <div class="fact" id="capF"></div>
</div>

<div class="legend" id="legend" hidden>
  <div class="lh">地面照度 <span>每条等照度线翻一倍</span></div>
  <div class="bar"></div>
  <div class="tk"><span>1.25</span><span>2.5</span><span>5</span><span>10</span><span>20</span><span>40</span><span>80</span><span>160</span><span>320 lx</span></div>
  <p>只看地面。走道 20–40 lx 落在绿色，桌面 150–200 lx 在橙红之间；切到“现状”对比那盏灯下的粉白和南半截的黑。</p>
</div>

<div class="loading" id="loading"><b>正在搭院子…</b><span>第一次打开要加载三维引擎，几秒钟。</span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lights/RectAreaLightUniformsLib.js"></script>
<script>
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const loadEl = $('#loading');
function fail(msg) { loadEl.classList.remove('done'); loadEl.innerHTML = '<b>三维场景没能打开</b><span>' + msg + '</span>'; }
if (!window.THREE || !THREE.OrbitControls || !THREE.RectAreaLightUniformsLib) {
  fail('三维引擎没有加载成功（cdn.jsdelivr.net 可能被网络拦截）。换个网络或刷新再试。'); return;
}

/* ================= 工具 ================= */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(923);
const rr = (a, b) => a + (b - a) * R();
const pick = (arr) => arr[Math.floor(R() * arr.length)];
const lin = (h) => new THREE.Color(h).convertSRGBToLinear();
const CCT = { 2700: [255, 212, 164], 3000: [255, 226, 192], 5500: [226, 237, 255] }; // 按约 3500 K 白平衡显示
function cct(K) { // 线性色、亮度归一：强度数值直接对应 lx
  const t = CCT[K]; const c = new THREE.Color(t[0] / 255, t[1] / 255, t[2] / 255).convertSRGBToLinear();
  return c.multiplyScalar(1 / (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b));
}
const coneCd = (lm, half) => lm / (2 * Math.PI * (1 - Math.cos(half)));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 720;

/* ================= 渲染器 ================= */
const canvas = $('#c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { fail('这个浏览器没有开启 WebGL，换 Chrome / Safari / Edge 再打开。'); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.1;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
THREE.RectAreaLightUniformsLib.init();
const SHADOW = small ? 512 : 1024;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 600);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 0.6; controls.maxDistance = 40;
controls.screenSpacePanning = true;

/* ================= 贴图 ================= */
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function tex(w, h, draw, o) {
  o = o || {};
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (o.srgb !== false) t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = o.clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.anisotropy = ANISO; if (o.rep) t.repeat.set(o.rep[0], o.rep[1]);
  return t;
}
// 地砖：0.2 m 宽条砖顺长向铺，带成组细纹（照片里那种）
const floorMap = tex(1024, 1024, (g, w, h) => {
  const r = rng(77); g.fillStyle = '#8b8f91'; g.fillRect(0, 0, w, h);
  const rows = 10, rh = h / rows;
  for (let i = 0; i < rows; i++) {
    let x = -r() * w * 0.5;
    while (x < w) {
      const len = w * (0.3 + r() * 0.28), v = 186 + Math.floor(r() * 18);
      const groups = [];
      for (let k = 0, n = 2 + Math.floor(r() * 2); k < n; k++) groups.push([i * rh + 12 + r() * (rh - 40), r() < 0.5]);
      for (const dx of [0, -w, w]) {
        const X = x + dx; if (X > w || X + len < 0) continue;
        g.fillStyle = 'rgb(' + v + ',' + (v + 2) + ',' + (v + 4) + ')'; g.fillRect(X + 2, i * rh + 2, len - 4, rh - 4);
        g.fillStyle = 'rgba(118,124,128,.42)';
        for (const [y0, dash] of groups) for (let l = 0; l < 5; l++) {
          if (dash) for (let s = X + 6; s < X + len - 12; s += 14) g.fillRect(s, y0 + l * 3.2, 9, 1.2);
          else g.fillRect(X + 6, y0 + l * 3.2, len - 12, 1.2);
        }
      }
      x += len;
    }
  }
  for (let i = 0; i < 9000; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)'; g.fillRect(r() * w, r() * h, 1.5, 1.5); }
}, { rep: [5.8, 2.15] });
function noiseMap(seed, n, a) {
  return tex(256, 256, (g, w, h) => {
    const r = rng(seed); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i++) { const s = 0.6 + r() * 2.4; g.fillStyle = (r() < 0.5 ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + (a * r()).toFixed(3) + ')'; g.fillRect(r() * w, r() * h, s, s); }
  });
}
const stuccoMap = noiseMap(3, 5200, 0.11); stuccoMap.repeat.set(7, 2);
const beigeMap = noiseMap(5, 5200, 0.09); beigeMap.repeat.set(3.5, 4);
const glowTex = tex(128, 128, (g) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.1, 'rgba(255,255,255,.8)');
  gr.addColorStop(0.3, 'rgba(255,255,255,.25)'); gr.addColorStop(0.65, 'rgba(255,255,255,.05)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
}, { srgb: false, clamp: true });
// 邻楼窗：底色贴图 + 发光贴图
const winCol = [], winEm = [];
(function () {
  const r = rng(41); const cells = [];
  for (let y = 0; y < 8; y++) for (let x = 0; x < 6; x++) {
    const lit = r() < 0.34; cells.push([x, y, lit, lit ? pick(['#ffd49a', '#ffe3bd', '#ffcf8a', '#cfe0ff', '#ffe9cc']) : null, 0.35 + r() * 0.65]);
  }
  winCol.push(tex(256, 256, (g) => {
    g.fillStyle = '#737980'; g.fillRect(0, 0, 256, 256);
    for (const [x, y] of cells) { g.fillStyle = '#2f353b'; g.fillRect(x * 42.6 + 10, y * 32 + 7, 22, 18); }
  }));
  winEm.push(tex(256, 256, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
    for (const [x, y, lit, c, a] of cells) if (lit) { g.globalAlpha = a; g.fillStyle = c; g.fillRect(x * 42.6 + 10, y * 32 + 7, 22, 18); }
    g.globalAlpha = 1;
  }));
})();

/* ================= 材质 ================= */
const std = (hex, rough, metal, o) => new THREE.MeshStandardMaterial(Object.assign({ color: lin(hex), roughness: rough == null ? 0.85 : rough, metalness: metal || 0 }, o || {}));

class Batch {
  constructor(mat, o) { this.mat = mat; this.parts = []; this.o = o || {}; }
  add(g) { this.parts.push(g.index ? g.toNonIndexed() : g); return this; }
  box(x0, y0, z0, x1, y1, z1) {
    const a = Math.min(x0, x1), b = Math.max(x0, x1), c = Math.min(y0, y1), d = Math.max(y0, y1), e = Math.min(z0, z1), f = Math.max(z0, z1);
    const g = new THREE.BoxGeometry(b - a, d - c, f - e); g.translate((a + b) / 2, (c + d) / 2, (e + f) / 2); return this.add(g);
  }
  cylY(r0, r1, x, y0, y1, z, seg) { const g = new THREE.CylinderGeometry(r0, r1, y1 - y0, seg || 10); g.translate(x, (y0 + y1) / 2, z); return this.add(g); }
  tube(a, b, r, seg) { // 两点间圆管
    const d = new THREE.Vector3().subVectors(b, a), len = d.length();
    const g = new THREE.CylinderGeometry(r, r, len, seg || 8); g.translate(0, len / 2, 0);
    g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0, 1, 0), d.normalize()))); g.translate(a.x, a.y, a.z); return this.add(g);
  }
  bar(a, b, tx, ty) { // 两点间矩形钢（截面 tx × ty）
    const d = new THREE.Vector3().subVectors(b, a), len = d.length();
    const g = new THREE.BoxGeometry(tx, ty, len);
    g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(V(0, 0, 1), d.normalize())));
    const m = a.clone().lerp(b, 0.5); g.translate(m.x, m.y, m.z); return this.add(g);
  }
  geometry() {
    let n = 0; for (const g of this.parts) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2); let o = 0;
    for (const g of this.parts) {
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
      if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2); o += g.attributes.position.count;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    return geo;
  }
  build() {
    const m = new THREE.Mesh(this.geometry(), this.mat);
    m.castShadow = this.o.cast !== false; m.receiveShadow = this.o.receive !== false; scene.add(m); return m;
  }
}
// 带顶点色的程序化几何（植物、花盆）
class GB {
  constructor() { this.p = []; this.c = []; }
  tri(a, b, c, ca, cb, cc) {
    cb = cb || ca; cc = cc || ca;
    this.p.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    this.c.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b, cc.r, cc.g, cc.b);
  }
  geo(g, m, col) {
    const t = g.index ? g.toNonIndexed() : g.clone(); if (m) t.applyMatrix4(m);
    const a = t.attributes.position.array;
    for (let i = 0; i < a.length; i += 3) { this.p.push(a[i], a[i + 1], a[i + 2]); this.c.push(col.r, col.g, col.b); }
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeVertexNormals(); return g;
  }
}
function gbStem(gb, a, b, r, col) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const g = new THREE.CylinderGeometry(r * 0.75, r, len, 5, 1, true); g.translate(0, len / 2, 0);
  const m = new THREE.Matrix4().compose(a, new THREE.Quaternion().setFromUnitVectors(V(0, 1, 0), d.normalize()), V(1, 1, 1));
  gb.geo(g, m, col);
}
function addLeaf(gb, base, dir, nrm, L, W, cB, cT) {
  const s = new THREE.Vector3().crossVectors(dir, nrm).normalize();
  const mid = base.clone().addScaledVector(dir, L * 0.45), tip = base.clone().addScaledVector(dir, L);
  const ridge = mid.clone().addScaledVector(nrm, W * 0.28);
  const e1 = mid.clone().addScaledVector(s, W), e2 = mid.clone().addScaledVector(s, -W);
  const cM = cB.clone().lerp(cT, 0.55);
  gb.tri(base, e1, ridge, cB, cM, cM); gb.tri(ridge, e1, tip, cM, cM, cT);
  gb.tri(base, ridge, e2, cB, cM, cM); gb.tri(ridge, tip, e2, cM, cT, cM);
}
const PURPLE = [['#3d3057', '#b9a8d2'], ['#48395f', '#cbbbe0'], ['#3a3350', '#a99bc2']].map((p) => ({ b: lin(p[0]), t: lin(p[1]) }));

function addRosette(gb, c, sc, r, pal) {
  const layers = [[12, 0.12, 0.036, 0.28, 0], [9, 0.092, 0.032, 0.68, 0.012], [6, 0.06, 0.026, 1.05, 0.026], [3, 0.032, 0.018, 1.32, 0.036]];
  let off = r() * 6.283;
  for (const [n, len, w, tilt, y0] of layers) {
    off += 0.42;
    for (let i = 0; i < n; i++) {
      const a = off + (i / n) * 6.283 + (r() - 0.5) * 0.18, t = tilt + (r() - 0.5) * 0.14;
      const dir = V(Math.cos(a) * Math.cos(t), Math.sin(t), Math.sin(a) * Math.cos(t));
      const nrm = new THREE.Vector3().crossVectors(V(-Math.sin(a), 0, Math.cos(a)), dir).normalize();
      addLeaf(gb, V(c.x, c.y + y0 * sc, c.z), dir, nrm, len * sc * (0.9 + r() * 0.2), w * sc, pal.b, pal.t);
    }
  }
}
function rosetteGeo(seed, pal) { const gb = new GB(), r = rng(seed); addRosette(gb, V(0, 0.005, 0), 1, r, pal); return gb.build(); }
function aeoniumGeo(seed) { // 茎上顶几朵莲座：模型里最多的那种紫色多肉
  const gb = new GB(), r = rng(seed), n = 2 + Math.floor(r() * 3), stem = lin('#6f5a45');
  for (let k = 0; k < n; k++) {
    const a = (k / n) * 6.283 + r() * 0.8, lean = 0.25 + r() * 0.45, h = 0.1 + r() * 0.28;
    const top = V(Math.cos(a) * Math.sin(lean) * h, h * Math.cos(lean) + 0.02, Math.sin(a) * Math.sin(lean) * h);
    gbStem(gb, V(0, 0, 0), top, 0.011, stem);
    addRosette(gb, top, 0.8 + r() * 0.55, r, PURPLE[Math.floor(r() * 3)]);
  }
  return gb.build();
}
function shrubGeo(seed, o) {
  const gb = new GB(), r = rng(seed);
  const n = o.n || 120, rx = o.rx || 0.3, ry = o.ry || 0.28, y0 = o.y0 == null ? 0.12 : o.y0, pal = o.pal.map(lin), stem = lin('#5a4a38');
  for (let i = 0; i < 5; i++) { const a = r() * 6.283; gbStem(gb, V(0, 0, 0), V(Math.cos(a) * rx * 0.35, y0 + ry * (0.7 + r() * 0.6), Math.sin(a) * rx * 0.35), 0.009, stem); }
  const cy = y0 + ry;
  for (let i = 0; i < n; i++) {
    const u = r() * 2 - 1, th = r() * 6.283, s = Math.sqrt(1 - u * u);
    const d = V(s * Math.cos(th), u * 0.85 + 0.15, s * Math.sin(th)).normalize();
    const f = 0.55 + 0.45 * Math.cbrt(r());
    const p = V(d.x * rx * f, Math.max(0.04, cy + d.y * ry * f), d.z * rx * f);
    const nrm = V(d.x * 0.6 + (r() - 0.5) * 0.8, 0.9 + r() * 0.4, d.z * 0.6 + (r() - 0.5) * 0.8).normalize();
    const dir = V(r() - 0.5, (r() - 0.5) * 0.6, r() - 0.5); dir.addScaledVector(nrm, -dir.dot(nrm)).normalize();
    const col = pal[Math.floor(r() * pal.length)];
    addLeaf(gb, p, dir, nrm, 0.07 + r() * 0.05, 0.028 + r() * 0.016, col.clone().multiplyScalar(0.55), col.clone().multiplyScalar(1.05 + r() * 0.15));
  }
  if (o.flowers) {
    const fc = lin(o.flower || '#e0709a'), fcd = fc.clone().multiplyScalar(0.7), eye = lin('#f3d27a');
    for (let i = 0; i < o.flowers; i++) {
      const th = r() * 6.283, u = 0.2 + r() * 0.8, s = Math.sqrt(1 - u * u);
      const d = V(s * Math.cos(th), u, s * Math.sin(th));
      const c = V(d.x * rx * 1.02, cy + d.y * ry * 1.02, d.z * rx * 1.02);
      const nrm = d.clone(), s1 = new THREE.Vector3().crossVectors(nrm, V(0.3, 0.1, 0.9)).normalize(), s2 = new THREE.Vector3().crossVectors(nrm, s1);
      const rad = 0.035 + r() * 0.02;
      for (let k = 0; k < 5; k++) {
        const a0 = (k / 5) * 6.283, a1 = a0 + 0.7;
        const p0 = c.clone().addScaledVector(s1, Math.cos(a0) * rad).addScaledVector(s2, Math.sin(a0) * rad);
        const p1 = c.clone().addScaledVector(s1, Math.cos(a1) * rad).addScaledVector(s2, Math.sin(a1) * rad);
        gb.tri(c, p0, p1, eye, fc, fcd);

  }
  return gb.build();
}
function treeGeo(seed, h, pal) { // 细干疏叶的高株（照片右侧那棵）
  const gb = new GB(), r = rng(seed), bark = lin('#76664f'), cols = pal.map(lin);
  const pts = [V(0, 0, 0)]; for (let i = 1; i <= 4; i++) pts.push(pts[i - 1].clone().add(V((r() - 0.5) * 0.09, h * 0.24, (r() - 0.5) * 0.09)));
  for (let i = 0; i < 4; i++) gbStem(gb, pts[i], pts[i + 1], 0.02 * (1 - i * 0.18), bark);
  const cluster = (c, n, spread) => {
    for (let k = 0; k < n; k++) {
      const u = r() * 2 - 1, th = r() * 6.283, s = Math.sqrt(1 - u * u), d = V(s * Math.cos(th), u, s * Math.sin(th));
      const p = c.clone().addScaledVector(d, 0.03 + r() * spread);
      const nrm = V(d.x * 0.5 + (r() - 0.5), 1, d.z * 0.5 + (r() - 0.5)).normalize();
      const dir = V(r() - 0.5, (r() - 0.5) * 0.4, r() - 0.5); dir.addScaledVector(nrm, -dir.dot(nrm)).normalize();
      const col = cols[Math.floor(r() * cols.length)];
      addLeaf(gb, p, dir, nrm, 0.09 + r() * 0.05, 0.034 + r() * 0.016, col.clone().multiplyScalar(0.6), col.clone().multiplyScalar(1.1));
    }
  };
  for (let b = 0; b < 8; b++) {
    const t = 0.38 + (b / 8) * 0.6, seg = Math.min(3, Math.floor(t * 4)), f = t * 4 - seg;
    const base = pts[seg].clone().lerp(pts[seg + 1], f), a = r() * 6.283, len = 0.2 + r() * 0.3;
    const tip = base.clone().add(V(Math.cos(a) * len, len * (0.45 + r() * 0.5), Math.sin(a) * len));
    gbStem(gb, base, tip, 0.008, bark); cluster(tip, 22, 0.13);

}

  if (sc) { $('#capN').textContent = sc.n; $('#capD').textContent = sc.d; $('#capF').textContent = sc.f; cap.classList.toggle('cold', !!sc.cold); }
  else { $('#capN').textContent = '自定义'; $('#capD').textContent = on.length ? '亮着：' + on.map((g) => g.id + ' ' + g.n).join('、') + '。' : '全部关着。'; $('#capF').textContent = W + ' W'; cap.classList.toggle('cold', on.length === 1 && on[0].id === 11); }
}

/* ================= 布局 / 渲染 ================= */
const vtmp = new THREE.Vector3();
function layout() {
  const w = innerWidth, h = innerHeight, mobile = w <= 760;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  if (mobile) { const ph = $('#panel').offsetHeight; camera.setViewOffset(w, h, 0, Math.round(ph * 0.42), w, h); }
  else camera.setViewOffset(w, h, 157, 0, w, h);
  camera.updateProjectionMatrix(); dirty = true;
}
function updateTags() {
  if (!tagsOn) return;
  const w = innerWidth, h = innerHeight;
  for (const g of GROUPS) {
    vtmp.copy(TAGPOS[g.id]).project(camera);
    const vis = vtmp.z < 1 && vtmp.z > -1 && Math.abs(vtmp.x) < 1.05 && Math.abs(vtmp.y) < 1.05;
    g.tag.style.display = vis ? '' : 'none';
    if (vis) g.tag.style.transform = 'translate(' + ((vtmp.x * 0.5 + 0.5) * w).toFixed(1) + 'px,' + ((-vtmp.y * 0.5 + 0.5) * h).toFixed(1) + 'px)';
  }
}
function render() {
  if (lightsChanged) { renderer.shadowMap.needsUpdate = true; lightsChanged = false; }
  renderer.render(scene, camera); updateTags();
}
function loop(now) {
  requestAnimationFrame(loop);
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i], k = t.dur ? Math.min(1, (now - t.t0) / t.dur) : 1; t.fn(ease(k));
    if (k >= 1) { tweens.splice(i, 1); if (t.done) t.done(); }
    dirty = true;
  }
  if (controls.update()) dirty = true;
  if (dirty) { dirty = false; render(); }
}
window.addEventListener('resize', layout);

/* ================= 启动 ================= */
setTime('night', true);
setScene('party', true);
goView('bird', true);
layout();
try { render(); } catch (e) { fail('渲染出错：' + (e && e.message ? e.message : e)); return; }
requestAnimationFrame(() => loadEl.classList.add('done'));
requestAnimationFrame(loop);
window.__rooftop = { setScene, setTime, goView, toggleOne, renderer, scene, camera, get falseOn() { return falseOn; }, setFalse: (v) => { if (v !== falseOn) $('#optFalse').click(); } };
})();
</script>
