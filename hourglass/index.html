<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="沙漏">
<meta name="theme-color" content="#0b0906">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="为 iPhone 16 Pro 打造的写实沙漏计时器">
<title>沙漏 · Hourglass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120d07'/%3E%3Cpath d='M18 12h28M18 52h28' stroke='%23b9a88c' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M22 14c0 10 10 14 10 18s-10 8-10 18h20c0-10-10-14-10-18s10-8 10-18z' fill='%23e0a94a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23120d07'/%3E%3Cpath d='M50 34h80M50 146h80' stroke='%23b9a88c' stroke-width='13' stroke-linecap='round'/%3E%3Cpath d='M61 39c0 28 29 39 29 51s-29 23-29 51h58c0-28-29-39-29-51s29-23 29-51z' fill='%23e0a94a'/%3E%3C/svg%3E">
<style>
/* ============ reset & 原生手感 ============ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #05040a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
               'Helvetica Neue', 'Noto Sans SC', sans-serif;
  color: #efe6d8;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  /* 禁止 iOS 橡皮筋 */
  position: fixed;
  inset: 0;
  width: 100%;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }

/* ============ 设备外框（仅桌面）============ */
.stagewrap {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}

.device {
  position: relative;
  width: 100%; height: 100%;
  /* 手机上：外框完全消失，App 直接全屏 */
}

/* 屏幕 = App 容器 */
.screen {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  background:
    radial-gradient(120% 78% at 50% 30%, #1d150c 0%, #120d08 42%, #0a0705 72%, #060404 100%);
  isolation: isolate;
}

/* 桌面端才画出真实设备 */
.bezel, .island, .statusbar, .homebar, .sidebtn, .glare { display: none; }

@media (min-width: 760px) and (min-height: 800px) {
  body { background: radial-gradient(80% 70% at 50% 25%, #17171d 0%, #0a0a0d 60%, #050507 100%); }

  .device {
    width: 402px; height: 874px;
    flex: none;
    filter: drop-shadow(0 48px 90px rgba(0,0,0,.72)) drop-shadow(0 8px 20px rgba(0,0,0,.5));
  }

  /* 钛金属中框 */
  .bezel {
    display: block;
    position: absolute;
    inset: -11px;
    border-radius: 73px;   /* 62 + 11 */
    background:
      linear-gradient(145deg, #8e8577 0%, #4b463e 14%, #b7ad9c 27%, #5d574d 42%,
                              #3b372f 58%, #a79d8c 73%, #4e4941 88%, #7d7566 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.20),
      inset 0 0 3px 1px rgba(0,0,0,.5);
  }
  /* 中框内侧的黑色收边 */
  .bezel::after {
    content: ''; position: absolute; inset: 9px;
    border-radius: 64px;
    background: #000;
    box-shadow: inset 0 0 6px 2px rgba(0,0,0,.9);
  }

  .screen { border-radius: 62px; }        /* iPhone 16 Pro 实测圆角 62pt */

  /* 灵动岛 */
  .island {
    display: block;
    position: absolute; top: 11px; left: 50%;
    transform: translateX(-50%);
    width: 125px; height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 60;
  }
  .island::after {           /* 前摄 */
    content: ''; position: absolute; right: 11px; top: 50%;
    transform: translateY(-50%);
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #26313f 0%, #0d1118 55%, #05070a 100%);
    box-shadow: inset 0 0 2px rgba(120,160,220,.35);
  }

  /* 状态栏 */
  .statusbar {
    display: flex;
    position: absolute; top: 0; left: 0; right: 0; height: 59px;
    align-items: center; justify-content: space-between;
    padding: 0 34px 0 38px;
    font-size: 16px; font-weight: 600; letter-spacing: .2px;
    color: #fff; z-index: 55; pointer-events: none;
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }

  /* Home Indicator */
  .homebar {
    display: block;
    position: absolute; bottom: 9px; left: 50%;
    transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.92);
    z-index: 55; pointer-events: none;
  }

  /* 侧边按键 */
  .sidebtn { display: block; position: absolute; }
  .sidebtn i {
    position: absolute; border-radius: 2px;
    background: linear-gradient(180deg, #6f6759, #322e28 45%, #8c8373);
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .b-action { left: -14px; top: 152px;  width: 4px; height: 32px; }
  .b-volup  { left: -14px; top: 218px;  width: 4px; height: 62px; }
  .b-voldn  { left: -14px; top: 292px;  width: 4px; height: 62px; }
  .b-power  { right: -14px; top: 246px; width: 4px; height: 96px; }
  /* 相机控制键 —— 16 Pro 新增 */
  .b-camera { right: -14px; top: 402px; width: 4px; height: 42px; }
  .b-camera::after {
    content: ''; position: absolute; inset: 0;
    border-radius: 2px;
    background: linear-gradient(180deg, rgba(220,235,255,.30), rgba(140,170,210,.10));
  }

  /* 屏幕玻璃斜向反光 */
  .glare {
    display: block;
    position: absolute; inset: 0;
    border-radius: 62px;
    background: linear-gradient(122deg,
      rgba(255,255,255,0) 34%,
      rgba(255,255,255,.055) 43%,
      rgba(255,255,255,.085) 47%,
      rgba(255,255,255,0) 56%);
    z-index: 70; pointer-events: none;
  }

  /* 桌面上给 App 顶部补出灵动岛让位（真机由 env() 提供）
     用 .screen .app 提高特异性，否则会被后面基础规则里的 env() 覆盖成 0 */
  .screen .app { --sat: 62px; --sab: 34px; }
}

/* ============ App 布局 ============ */
.app {
  /* 真机取 env()，桌面/不支持时回落到 16 Pro 实测值 */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--sat) + 8px) calc(var(--sar) + 16px)
           calc(var(--sab) + 10px) calc(var(--sal) + 16px);
  z-index: 10;
}

/* ---- 倒计时读数 ---- */
.readout {
  flex: none;
  text-align: center;
  padding-top: 6px;
  height: 78px;
}
.time {
  font-size: 52px;
  font-weight: 250;
  letter-spacing: 1px;
  line-height: 1.04;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
  color: #f6ecdb;
  text-shadow: 0 0 26px rgba(224,169,74,.30);
  transition: color .3s ease;
}
.time.done { color: #ffc978; animation: breathe 1.5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity:1 } 50% { opacity:.42 } }

.subline {
  margin-top: 3px;
  font-size: 12px;
  letter-spacing: 2.5px;
  color: #8b7d68;
  text-transform: uppercase;
  height: 15px;
}
.subline b { color: #d8a85f; font-weight: 600; }

/* ---- 沙漏舞台 ---- */
.stage {
  flex: 1 1 auto;
  position: relative;
  min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
#glass {
  display: block;
  width: 100%; height: 100%;
  transform-origin: 50% 50%;
  will-change: transform;
}
.stage.flipping #glass { transition: transform .72s cubic-bezier(.62,.02,.34,1); }

/* 点击提示 */
.hint {
  flex: none;
  height: 16px;
  text-align: center;
  font-size: 11.5px; letter-spacing: 1.6px;
  color: #6d6252;
  pointer-events: none;
  transition: opacity .35s ease;
}

/* ---- 预设时长 ---- */
.presets {
  flex: none;
  display: flex; gap: 8px;
  padding: 12px 2px 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.presets::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  min-width: 52px; height: 40px;
  padding: 0 14px;
  border-radius: 20px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.075);
  color: #b6a892;
  font-size: 15px; font-weight: 500;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center;
  scroll-snap-align: center;
  transition: background .22s, color .22s, border-color .22s, transform .12s;
}
.chip:active { transform: scale(.94); }
.chip.on {
  background: linear-gradient(180deg, rgba(232,178,88,.26), rgba(200,140,54,.16));
  border-color: rgba(240,196,116,.52);
  color: #ffdca6;
  box-shadow: 0 0 18px rgba(224,169,74,.20), inset 0 1px 0 rgba(255,255,255,.14);
}
.chip small { font-size: 11px; opacity: .65; margin-left: 2px; }

/* ---- 控制栏 ---- */
.controls {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px;
  padding: 4px 6px 2px;
  height: 84px;
}
.iconbtn {
  width: 52px; height: 52px; flex: none;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.085);
  color: #c3b49c;
  transition: transform .12s, background .2s, color .2s;
}
.iconbtn:active { transform: scale(.9); background: rgba(255,255,255,.12); }
.iconbtn.on { color: #ffce8a; border-color: rgba(240,196,116,.45); background: rgba(232,178,88,.16); }
.iconbtn svg { width: 23px; height: 23px; }

.primary {
  flex: 1 1 auto;
  height: 56px;
  border-radius: 28px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 17px; font-weight: 600; letter-spacing: 1.5px;
  color: #2a1c07;
  background: linear-gradient(180deg, #f4c979 0%, #e0a94a 52%, #c78c31 100%);
  box-shadow: 0 6px 20px rgba(224,169,74,.30), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .12s, filter .2s;
}
.primary:active { transform: scale(.97); filter: brightness(.94); }
.primary svg { width: 19px; height: 19px; }
.primary.running {
  color: #efe2cd;
  background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.055));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}

/* ============ 底部抽屉（自定义时长 / 设置）============ */
.scrim {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity .28s ease;
}
.scrim.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 45;
  padding: 18px calc(var(--sal, 0px) + 20px)
           calc(var(--sab, 0px) + 20px) calc(var(--sar, 0px) + 20px);
  border-radius: 26px 26px 0 0;
  background: linear-gradient(180deg, #221a11 0%, #16100a 100%);
  box-shadow: 0 -12px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.09);
  transform: translateY(102%);
  transition: transform .34s cubic-bezier(.32,.72,.28,1);
}
.sheet.show { transform: translateY(0); }
.sheet .grab {
  width: 38px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,.2);
  margin: -6px auto 16px;
}
.sheet h2 { font-size: 16px; font-weight: 600; color: #e6d8c2; margin-bottom: 14px; letter-spacing: .5px; }

.dialrow { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; }
.dialrow button {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
  font-size: 24px; color: #d9c9ae; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.dialrow button:active { background: rgba(255,255,255,.15); }
.dialval { font-size: 44px; font-weight: 250; font-variant-numeric: tabular-nums; color: #ffd79c; min-width: 118px; text-align: center; }
.dialval span { font-size: 15px; color: #8b7d68; margin-left: 5px; letter-spacing: 1px; }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 30px; background: transparent; margin-bottom: 6px;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 5px; border-radius: 3px; background: rgba(255,255,255,.13);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%; margin-top: -10.5px;
  background: linear-gradient(180deg, #f7d69a, #dfa94c);
  box-shadow: 0 2px 8px rgba(0,0,0,.45);
}
input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.13); }
input[type=range]::-moz-range-thumb {
  width: 26px; height: 26px; border: 0; border-radius: 50%;
  background: linear-gradient(180deg, #f7d69a, #dfa94c);
}

.row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 2px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.row:first-of-type { border-top: 0; }
.row .lbl { font-size: 15px; color: #ddcfb8; }
.row .lbl em { display: block; font-style: normal; font-size: 11.5px; color: #7d7160; margin-top: 3px; letter-spacing: .2px; }

/* 开关 */
.sw {
  width: 51px; height: 31px; flex: none; border-radius: 16px;
  background: rgba(255,255,255,.15); position: relative;
  transition: background .25s;
}
.sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.3,.9,.4,1);
}
.sw.on { background: #4bbd5c; }
.sw.on::after { transform: translateX(20px); }
.sw.disabled { opacity: .38; }

.sheetdone {
  width: 100%; height: 50px; margin-top: 14px;
  border-radius: 25px; font-size: 16px; font-weight: 600; letter-spacing: 2px;
  color: #2a1c07;
  background: linear-gradient(180deg, #f4c979, #d99f3f);
}

/* ============ 横屏提示 ============ */
.rotate {
  position: absolute; inset: 0; z-index: 90;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: #0a0705; color: #a2937c;
  font-size: 15px; letter-spacing: 2px;
}
.rotate svg { width: 46px; height: 46px; opacity: .75; }
@media (orientation: landscape) and (max-height: 500px) {
  .rotate { display: flex; }
}

/* ============ Toast ============ */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--sab, 0px) + 108px);
  transform: translate(-50%, 8px); z-index: 80;
  padding: 10px 18px; border-radius: 20px;
  background: rgba(24,18,11,.94);
  box-shadow: 0 6px 24px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.09);
  font-size: 13.5px; color: #e2d3ba; letter-spacing: .4px;
  white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .3s, transform .3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============ P3 广色域增强（16 Pro OLED 上明显更通透）============ */
@supports (color: color(display-p3 1 1 1)) {
  .time { color: color(display-p3 .965 .925 .862); }
  .chip.on { color: color(display-p3 1 .862 .655); }
  .primary { background: linear-gradient(180deg,
      color(display-p3 .957 .792 .478) 0%,
      color(display-p3 .878 .663 .290) 52%,
      color(display-p3 .780 .549 .192) 100%); }
  .dialval { color: color(display-p3 1 .843 .612); }
}

/* 尊重减弱动态偏好 */
@media (prefers-reduced-motion: reduce) {
  .stage.flipping #glass { transition-duration: .01ms; }
  .time.done { animation: none; }
}
</style>
</head>
<body>
<div class="stagewrap">
<div class="device">
  <div class="bezel"></div>
  <div class="sidebtn b-action"><i style="inset:0"></i></div>
  <div class="sidebtn b-volup"><i style="inset:0"></i></div>
  <div class="sidebtn b-voldn"><i style="inset:0"></i></div>
  <div class="sidebtn b-power"><i style="inset:0"></i></div>
  <div class="sidebtn b-camera"><i style="inset:0"></i></div>

  <div class="screen">

    <!-- 状态栏 + 灵动岛（仅桌面模拟显示） -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><path d="M8.5 11.2 6.1 8.6a3.6 3.6 0 0 1 4.8 0zM3.6 6.1a7.4 7.4 0 0 1 9.8 0l1.5-1.7a9.7 9.7 0 0 0-12.8 0zM.6 2.7a11.9 11.9 0 0 1 15.8 0L17.7 1A14.2 14.2 0 0 0 .3 1z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x=".6" y=".6" width="22" height="11.8" rx="3.4" stroke="currentColor" stroke-opacity=".38"/><rect x="2.2" y="2.2" width="18.8" height="8.6" rx="2.1" fill="currentColor"/><path d="M24.4 4.3v4.4a2.4 2.4 0 0 0 0-4.4z" fill="currentColor" fill-opacity=".45"/></svg>
      </span>
    </div>
    <div class="island"></div>

    <!-- ============ App ============ -->
    <div class="app">

      <div class="readout">
        <div class="time" id="time">25:00</div>
        <div class="subline" id="subline">专注 · FOCUS</div>
      </div>

      <div class="stage" id="stage">
        <canvas id="glass"></canvas>
      </div>
      <div class="hint" id="hint">轻点沙漏开始 · 下滑翻转</div>

      <div class="presets" id="presets"></div>

      <div class="controls">
        <button class="iconbtn" id="btnFlip" aria-label="翻转沙漏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10a8 8 0 0 0-14.3-5M4 6v4h4"/><path d="M4 14a8 8 0 0 0 14.3 5M20 18v-4h-4"/>
          </svg>
        </button>

        <button class="primary" id="btnMain">
          <svg id="mainIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6c0-.9 1-1.5 1.8-1L19 10.3c.7.5.7 1.5 0 2L9.8 18c-.8.5-1.8-.1-1.8-1z"/></svg>
          <span id="mainLabel">开始</span>
        </button>

        <button class="iconbtn" id="btnSettings" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>

<div class="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M12 18.2h.01"/>
  </svg>
  <div>请竖屏使用</div>
</div>

<script>
(function () {
'use strict';

/* ══════════════════════════════════════════════════════════════
   1. 沙漏轮廓 —— Catmull-Rom 样条
   控制点 (t, 半宽/R)，t=0 是腔体外端，t=1 是颈口。
   绘制路径与面积表共用同一条曲线，保证 clip 与沙面计算绝不打架。
   ══════════════════════════════════════════════════════════════ */
var CTRL = [
  [0.000, 0.255], [0.035, 0.520], [0.090, 0.762], [0.170, 0.918],
  [0.290, 1.000], [0.430, 0.962], [0.570, 0.852], [0.700, 0.652],
  [0.815, 0.412], [0.905, 0.203], [0.962, 0.108], [1.000, 0.070]
];
var FILL_T = 0.075;              // 满沙时的液面位置 —— 顶部留出空气层
var PN = 600;                       // 轮廓采样数
var PROF = new Float64Array(PN + 1);

(function buildProfile() {
  for (var i = 0; i <= PN; i++) {
    var t = i / PN, k = 0;
    while (k < CTRL.length - 2 && CTRL[k + 1][0] < t) k++;
    var p0 = CTRL[Math.max(0, k - 1)], p1 = CTRL[k],
        p2 = CTRL[k + 1],             p3 = CTRL[Math.min(CTRL.length - 1, k + 2)];
    var span = p2[0] - p1[0];
    var u = span > 0 ? (t - p1[0]) / span : 0;
    var u2 = u * u, u3 = u2 * u;
    var v = 0.5 * ((2 * p1[1]) +
                   (-p0[1] + p2[1]) * u +
                   (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 +
                   (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
    PROF[i] = Math.max(0.062, Math.min(1, v));
  }
})();

function prof(t) {                  // t∈[0,1] → 半宽比例
  if (t <= 0) return PROF[0];
  if (t >= 1) return PROF[PN];
  var x = t * PN, i = x | 0, f = x - i;
  return PROF[i] + (PROF[i + 1] - PROF[i]) * f;
}

/* ══════════════════════════════════════════════════════════════
   2. 几何 + 体积守恒查找表
   ══════════════════════════════════════════════════════════════ */
var G = {};                         // 当前几何
var AN = 800;                       // 面积表精度
var cumA = new Float64Array(AN + 1);
var A_TOTAL = 0, A_FILL0 = 0, A_SAND = 0;
var TAN_REPOSE = Math.tan(32 * Math.PI / 180);   // 沙的休止角 ≈32°
var PH = 260;                       // 沙堆高度表精度
var pileTbl = new Float64Array(PH + 1);
var pileMaxH = 0;

function halfWAtY(y) {              // 玻璃在高度 y 处的半宽（px）
  var d = Math.abs(y - G.neckY) / G.chamberH;
  if (d >= 1) return G.R * PROF[0];
  return G.R * prof(1 - d);
}

function buildTables() {
  // 上腔累计面积：cumA[i] = 从腔顶到 t=i/AN 的横截面积
  var acc = 0, dy = G.chamberH / AN;
  cumA[0] = 0;
  for (var i = 1; i <= AN; i++) {
    var a = prof((i - 1) / AN), b = prof(i / AN);
    acc += (a + b) * G.R * dy;      // (a+b)/2 * 2R * dy
    cumA[i] = acc;
  }
  A_TOTAL = acc;
  A_FILL0 = cumA[Math.round(FILL_T * AN)];      // 空气层占掉的面积
  A_SAND  = A_TOTAL - A_FILL0;                  // 实际沙量

  // 下腔沙堆：给定堆高 h，锥体∩腔体 的面积
  pileMaxH = G.chamberH * 1.35;
  for (var j = 0; j <= PH; j++) pileTbl[j] = pileAreaFor(pileMaxH * j / PH);
}

function pileAreaFor(h) {
  var yFloor = G.gy0 + G.GH, yApex = yFloor - h;
  var yTop = Math.max(yApex, G.neckY);
  var span = yFloor - yTop;
  if (span <= 0) return 0;
  var M = 200, d = span / M, a = 0;
  for (var i = 0; i < M; i++) {
    var y = yTop + (i + 0.5) * d;
    var hw = Math.min(halfWAtY(y), (y - yApex) / TAN_REPOSE);
    if (hw > 0) a += 2 * hw * d;
  }
  return a;
}

/* 已流走比例 p → 上腔沙面参数 t（0=腔顶，1=颈口） */
function topLevelT(p) {
  var target = A_FILL0 + A_SAND * p;
  var lo = 0, hi = AN;
  while (lo < hi) {
    var mid = (lo + hi) >> 1;
    if (cumA[mid] < target) lo = mid + 1; else hi = mid;
  }
  if (lo === 0) return 0;
  var a0 = cumA[lo - 1], a1 = cumA[lo];
  var f = a1 > a0 ? (target - a0) / (a1 - a0) : 0;
  return (lo - 1 + f) / AN;
}

/* 已流走比例 p → 下腔沙堆高度（px） */
function pileHeight(p) {
  var target = A_SAND * p;
  if (target <= 0) return 0;
  if (target >= pileTbl[PH]) return pileMaxH;
  var lo = 0, hi = PH;
  while (lo < hi) {
    var mid = (lo + hi) >> 1;
    if (pileTbl[mid] < target) lo = mid + 1; else hi = mid;
  }
  if (lo === 0) return 0;
  var a0 = pileTbl[lo - 1], a1 = pileTbl[lo];
  var f = a1 > a0 ? (target - a0) / (a1 - a0) : 0;
  return pileMaxH * (lo - 1 + f) / PH;
}

/* ══════════════════════════════════════════════════════════════
   3. 颗粒噪声贴图（做沙子的粗糙质感）
   ══════════════════════════════════════════════════════════════ */
var noisePat = null;
function buildNoise(ctx) {
  var n = document.createElement('canvas');
  n.width = n.height = 72;
  var c = n.getContext('2d');
  var img = c.createImageData(72, 72);
  for (var i = 0; i < 72 * 72; i++) {
    var v = Math.random();
    var o = i * 4;
    img.data[o] = 255; img.data[o + 1] = 240; img.data[o + 2] = 210;
    img.data[o + 3] = v > 0.62 ? (v - 0.62) * 210 : 0;
  }
  c.putImageData(img, 0, 0);
  noisePat = ctx.createPattern(n, 'repeat');
}

/* ══════════════════════════════════════════════════════════════
   4. 状态
   ══════════════════════════════════════════════════════════════ */
var cv     = document.getElementById('glass');
var ctx    = cv.getContext('2d');
var stageEl= document.getElementById('stage');

var S = {
  totalMs: 25 * 60 * 1000,
  remainMs: 25 * 60 * 1000,
  endAt: 0,
  running: false,
  done: false,
  p: 0,                       // 已流走比例 0..1
  phase: 'focus',
  presetMin: 25
};
var opt = { motion: false, sound: true, pomo: false, wake: true };

var tween  = null;            // {from,to,t0,dur}
var crater = 0;               // 漏斗凹陷强度 0..1
var tiltG  = 0;               // 重力左右倾角（弧度）
var tiltT  = 0;               // 平滑后的倾角
var grains = [];
var flipping = false;
var rotDeg = 0;
var lastTs = 0;
var dpr = 1;

/* ══════════════════════════════════════════════════════════════
   5. 布局
   ══════════════════════════════════════════════════════════════ */
function layout() {
  var r = stageEl.getBoundingClientRect();
  var w = Math.max(80, Math.round(r.width));
  var h = Math.max(80, Math.round(r.height));
  dpr = Math.min(window.devicePixelRatio || 1, 3);   // 16 Pro = 3

  cv.width  = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';

  var plateH = Math.round(Math.max(10, Math.min(18, h * 0.026)));
  var GH = Math.min(h - plateH * 2 - 14, w * 1.86);
  var R  = Math.min(GH * 0.232, w * 0.5 - 34);

  G = {
    w: w, h: h, plateH: plateH, GH: GH, R: R,
    cx: w / 2,
    gy0: (h - GH) / 2,
    neckY: (h - GH) / 2 + GH / 2,
    chamberH: GH / 2
  };
  G.outline = buildOutline();
  buildTables();
  if (!noisePat) buildNoise(ctx);
}

function buildOutline() {
  var p = new Path2D(), N = 200, i, t;
  var cx = G.cx, R = G.R, gy0 = G.gy0, ch = G.chamberH, neckY = G.neckY;
  p.moveTo(cx + R * prof(0), gy0);
  for (i = 1; i <= N; i++) { t = i / N; p.lineTo(cx + R * prof(t), gy0 + t * ch); }
  for (i = N - 1; i >= 0; i--) { t = i / N; p.lineTo(cx + R * prof(t), neckY + (1 - t) * ch); }
  p.lineTo(cx - R * prof(0), gy0 + G.GH);
  for (i = 1; i <= N; i++) { t = i / N; p.lineTo(cx - R * prof(t), gy0 + G.GH - t * ch); }
  for (i = N - 1; i >= 0; i--) { t = i / N; p.lineTo(cx - R * prof(t), neckY - (1 - t) * ch); }
  p.closePath();
  return p;
}

/* ══════════════════════════════════════════════════════════════
   6. 绘制
   ══════════════════════════════════════════════════════════════ */
var SAND_HI = '#f6d597', SAND_MID = '#dCA249', SAND_LO = '#9c6a20';

function titanium(x0, x1, y) {
  var g = ctx.createLinearGradient(x0, y, x1, y);
  g.addColorStop(0.00, '#3c372f');
  g.addColorStop(0.16, '#8b8171');
  g.addColorStop(0.34, '#c3b8a4');
  g.addColorStop(0.52, '#6d6557');
  g.addColorStop(0.72, '#a99e8c');
  g.addColorStop(0.88, '#4a453c');
  g.addColorStop(1.00, '#726a5c');
  return g;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawGlow() {
  var g = ctx.createRadialGradient(G.cx, G.gy0 + G.GH * 0.52, 0,
                                   G.cx, G.gy0 + G.GH * 0.52, G.GH * 0.78);
  g.addColorStop(0, 'rgba(224,169,74,0.115)');
  g.addColorStop(0.45, 'rgba(190,130,52,0.05)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, G.w, G.h);
}

function drawPosts() {
  var pw = Math.max(7, G.R * 0.115);
  var px = G.R + Math.max(11, G.R * 0.14);
  var y0 = G.gy0 - G.plateH * 0.45, y1 = G.gy0 + G.GH + G.plateH * 0.45;
  [-1, 1].forEach(function (sg) {
    var x = G.cx + sg * px - pw / 2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = sg * 2;
    ctx.fillStyle = titanium(x, x + pw, y0);
    rrect(x, y0, pw, y1 - y0, pw * 0.46);
    ctx.fill();
    ctx.restore();
    // 拉丝竖纹
    ctx.globalAlpha = .5;
    for (var i = 1; i < 4; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.16)';
      ctx.fillRect(x + pw * (0.18 + i * 0.17), y0 + 4, Math.max(0.6, pw * 0.05), y1 - y0 - 8);
    }
    ctx.globalAlpha = 1;
  });
}

function drawPlates() {
  var halfW = G.R + Math.max(20, G.R * 0.26);
  [G.gy0 - G.plateH, G.gy0 + G.GH].forEach(function (y, idx) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = idx ? 4 : -2;
    ctx.fillStyle = titanium(G.cx - halfW, G.cx + halfW, y);
    rrect(G.cx - halfW, y, halfW * 2, G.plateH, G.plateH * 0.30);
    ctx.fill();
    ctx.restore();
    // 上下倒角
    var hg = ctx.createLinearGradient(0, y, 0, y + G.plateH);
    hg.addColorStop(0.00, 'rgba(255,255,255,.38)');
    hg.addColorStop(0.20, 'rgba(255,255,255,.06)');
    hg.addColorStop(0.55, 'rgba(0,0,0,.12)');
    hg.addColorStop(0.88, 'rgba(0,0,0,.34)');
    hg.addColorStop(1.00, 'rgba(255,255,255,.16)');
    ctx.fillStyle = hg;
    rrect(G.cx - halfW, y, halfW * 2, G.plateH, G.plateH * 0.30);
    ctx.fill();
  });
}

function drawCavity() {
  ctx.save(); ctx.clip(G.outline);
  var g = ctx.createLinearGradient(G.cx - G.R, 0, G.cx + G.R, 0);
  g.addColorStop(0, 'rgba(8,6,4,.62)');
  g.addColorStop(0.42, 'rgba(20,14,9,.20)');
  g.addColorStop(1, 'rgba(8,6,4,.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, G.w, G.h);
  ctx.restore();
}

/* 上腔沙体：沙面带漏斗凹陷 + 重力倾斜 */
function drawTopSand(p) {
  if (p >= 0.9992) return;
  var tL = topLevelT(p);
  var yL = G.gy0 + tL * G.chamberH;
  var hwL = G.R * prof(tL);
  var far = G.R * 2.4;

  // 凹陷：随流动淡入，随剩余变少而变深、变尖
  var dipMax = Math.min(hwL * 0.52, G.chamberH * 0.155);
  var dip = crater * dipMax * (0.46 + 0.54 * p);
  dip = Math.min(dip, (G.neckY - yL) * 0.55);
  var expo = 2.15 - 0.95 * p;                  // 碗 → 漏斗
  var tan = Math.tan(tiltT);

  ctx.save();
  ctx.clip(G.outline);
  ctx.beginPath();
  var SN = 44, i, x, u, dx, y = yL;
  ctx.moveTo(G.cx - far, yL + tan * (-far));
  for (i = 0; i <= SN; i++) {
    u = i / SN;
    x = G.cx - hwL + u * 2 * hwL;
    dx = hwL > 0.5 ? (x - G.cx) / hwL : 0;
    y = yL + dip * (1 - Math.pow(Math.abs(dx), expo)) + tan * (x - G.cx);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(G.cx + far, yL + tan * far);
  ctx.lineTo(G.cx + far, G.neckY + 3);
  ctx.lineTo(G.cx - far, G.neckY + 3);
  ctx.closePath();

  var sg = ctx.createLinearGradient(0, yL - 6, 0, G.neckY);
  sg.addColorStop(0.00, '#f0c886');
  sg.addColorStop(0.10, '#e3b467');
  sg.addColorStop(0.45, '#d3a052');
  sg.addColorStop(1.00, '#a97a2e');
  ctx.fillStyle = sg; ctx.fill();

  // 圆柱体积感
  var vg = ctx.createLinearGradient(G.cx - hwL, 0, G.cx + hwL, 0);
  vg.addColorStop(0.00, 'rgba(52,28,3,.52)');
  vg.addColorStop(0.16, 'rgba(90,54,10,.20)');
  vg.addColorStop(0.34, 'rgba(255,232,182,.13)');
  vg.addColorStop(0.60, 'rgba(0,0,0,0)');
  vg.addColorStop(0.86, 'rgba(56,30,4,.28)');
  vg.addColorStop(1.00, 'rgba(44,22,2,.50)');
  ctx.fillStyle = vg; ctx.fill();

  grainTexture();

  // 沙面亮边
  ctx.beginPath();
  for (i = 0; i <= SN; i++) {
    u = i / SN;
    x = G.cx - hwL + u * 2 * hwL;
    dx = hwL > 0.5 ? (x - G.cx) / hwL : 0;
    y = yL + dip * (1 - Math.pow(Math.abs(dx), expo)) + tan * (x - G.cx);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(255,236,196,.42)';
  ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();
}

/* 沙的颗粒质感：两层不同密度的噪声 */
function grainTexture() {
  if (!noisePat) return;
  ctx.save();
  ctx.globalAlpha = 0.30; ctx.fillStyle = noisePat; ctx.fill();
  ctx.globalAlpha = 0.16; ctx.translate(23, 41); ctx.fillStyle = noisePat; ctx.fill();
  ctx.restore();
}

/* 下腔沙堆：休止角锥体 */
function drawPile(p) {
  if (p <= 0.0004) return;
  var h = pileHeight(p);
  var yFloor = G.gy0 + G.GH, yApex = yFloor - h;
  var far = G.R * 2.4;
  var apexX = G.cx + Math.tan(tiltT) * h * 0.5;
  var rr = Math.min(G.R * 0.16, h * 0.5);

  ctx.save();
  ctx.clip(G.outline);
  ctx.beginPath();
  ctx.rect(G.cx - far, G.neckY, far * 2, G.GH);
  ctx.clip();

  ctx.beginPath();
  ctx.moveTo(G.cx - far, yApex + (far + (apexX - G.cx)) * TAN_REPOSE);
  ctx.lineTo(apexX - rr, yApex + rr * TAN_REPOSE);
  ctx.quadraticCurveTo(apexX, yApex, apexX + rr, yApex + rr * TAN_REPOSE);
  ctx.lineTo(G.cx + far, yApex + (far - (apexX - G.cx)) * TAN_REPOSE);
  ctx.lineTo(G.cx + far, yFloor + 5);
  ctx.lineTo(G.cx - far, yFloor + 5);
  ctx.closePath();

  var pg = ctx.createLinearGradient(0, yApex, 0, yFloor);
  pg.addColorStop(0.00, '#f2cd8b');
  pg.addColorStop(0.14, '#dfb066');
  pg.addColorStop(0.55, '#c8934a');
  pg.addColorStop(1.00, '#8e6320');
  ctx.fillStyle = pg; ctx.fill();

  // 锥面受光
  var lg = ctx.createLinearGradient(apexX - G.R, 0, apexX + G.R, 0);
  lg.addColorStop(0.00, 'rgba(46,24,2,.46)');
  lg.addColorStop(0.28, 'rgba(255,232,180,.16)');
  lg.addColorStop(0.52, 'rgba(255,244,214,.07)');
  lg.addColorStop(1.00, 'rgba(46,24,2,.42)');
  ctx.fillStyle = lg; ctx.fill();

  grainTexture();

  // 堆脊亮线
  ctx.beginPath();
  ctx.moveTo(G.cx - far, yApex + (far + (apexX - G.cx)) * TAN_REPOSE);
  ctx.lineTo(apexX - rr, yApex + rr * TAN_REPOSE);
  ctx.quadraticCurveTo(apexX, yApex, apexX + rr, yApex + rr * TAN_REPOSE);
  ctx.lineTo(G.cx + far, yApex + (far - (apexX - G.cx)) * TAN_REPOSE);
  ctx.strokeStyle = 'rgba(255,238,200,.34)';
  ctx.lineWidth = 1.1; ctx.stroke();

  // 落砂冲击的小凹坑
  if (S.running && h > 8) {
    var pr = Math.min(11, h * 0.28);
    var dg = ctx.createRadialGradient(apexX, yApex + 1, 0, apexX, yApex + 1, pr);
    dg.addColorStop(0, 'rgba(255,238,198,.30)');
    dg.addColorStop(0.55, 'rgba(226,180,110,.12)');
    dg.addColorStop(1, 'rgba(226,180,110,0)');
    ctx.fillStyle = dg;
    ctx.fillRect(apexX - pr, yApex - pr * 0.7, pr * 2, pr * 1.6);
  }
  ctx.restore();
}

/* 落砂细流 */
function drawStream(p) {
  if (p <= 0.0002 || p >= 0.9998) return;
  var h = pileHeight(p);
  var yTop = G.neckY - G.chamberH * 0.045;
  var yEnd = G.gy0 + G.GH - h;
  if (yEnd <= yTop + 4) return;

  var drift = Math.tan(tiltT) * (yEnd - yTop) * 0.45;
  var mid = (yTop + yEnd) / 2;
  ctx.save();
  ctx.clip(G.outline);
  ctx.lineCap = 'round';

  // 外圈柔光
  ctx.beginPath();
  ctx.moveTo(G.cx, yTop);
  ctx.quadraticCurveTo(G.cx + drift * 0.4, mid, G.cx + drift, yEnd);
  ctx.strokeStyle = 'rgba(238,190,110,.12)';
  ctx.lineWidth = 8; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(G.cx, yTop);
  ctx.quadraticCurveTo(G.cx + drift * 0.4, mid, G.cx + drift, yEnd);
  ctx.strokeStyle = 'rgba(244,206,140,.24)';
  ctx.lineWidth = 4.2; ctx.stroke();

  // 主体
  var sg = ctx.createLinearGradient(0, yTop, 0, yEnd);
  sg.addColorStop(0.00, 'rgba(247,220,171,.95)');
  sg.addColorStop(0.35, 'rgba(232,189,114,.85)');
  sg.addColorStop(0.88, 'rgba(217,165,78,.55)');
  sg.addColorStop(1.00, 'rgba(217,165,78,.15)');
  ctx.beginPath();
  ctx.moveTo(G.cx, yTop);
  ctx.quadraticCurveTo(G.cx + drift * 0.4, mid, G.cx + drift, yEnd);
  ctx.strokeStyle = sg; ctx.lineWidth = 2.2; ctx.stroke();

  // 流内颗粒
  for (var i = 0; i < 16; i++) {
    var u = Math.random();
    var y = yTop + (yEnd - yTop) * u;
    var x = G.cx + drift * u * u + (Math.random() - 0.5) * 3.6;
    ctx.beginPath();
    ctx.arc(x, y, 0.55 + Math.random() * 0.75, 0, 6.2832);
    ctx.fillStyle = Math.random() > .5 ? 'rgba(255,244,214,.75)' : 'rgba(226,178,104,.65)';
    ctx.fill();
  }
  ctx.restore();
}

/* 颗粒（落地溅射） */
function stepGrains(dt, p) {
  var yFloor = G.gy0 + G.GH, h = pileHeight(p);
  var yApex = yFloor - h;
  if (S.running && p > 0.0002 && p < 0.9998 && grains.length < 46) {
    for (var k = 0; k < 2; k++)
      grains.push({ x: G.cx + (Math.random() - 0.5) * 2.4, y: G.neckY,
                    vx: (Math.random() - 0.5) * 6, vy: 40 + Math.random() * 70,
                    r: 0.9 + Math.random() * 1.1, life: 1 });
  }
  for (var i = grains.length - 1; i >= 0; i--) {
    var g = grains[i];
    g.vy += 900 * dt;
    g.vx += Math.tan(tiltT) * 420 * dt;
    g.x += g.vx * dt; g.y += g.vy * dt;
    var surf = yApex + Math.abs(g.x - G.cx) * TAN_REPOSE;
    if (g.y >= surf) {                       // 落到堆面 → 沿坡滑落一小段
      g.y = surf; g.vy *= -0.22;
      g.vx = (g.x >= G.cx ? 1 : -1) * (18 + Math.random() * 26);
      g.life -= 0.42;
    }
    g.life -= dt * 0.55;
    if (g.life <= 0 || g.y > yFloor) grains.splice(i, 1);
  }
}

function drawGrains() {
  if (!grains.length) return;
  ctx.save(); ctx.clip(G.outline);
  for (var i = 0; i < grains.length; i++) {
    var g = grains[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, g.life)) * 0.85;
    ctx.fillStyle = i % 3 === 0 ? '#fff0cc' : '#e9bd72';
    ctx.fillRect(g.x, g.y, g.r * 1.6, g.r * 1.6);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* 玻璃本体：高光、折射、边缘 */
function drawGlass() {
  ctx.save();
  ctx.clip(G.outline);

  // 内壁暗边（让空腔也能看出是玻璃）
  ctx.save();
  ctx.strokeStyle = 'rgba(10,8,6,.42)';
  ctx.lineWidth = 9; ctx.stroke(G.outline);
  ctx.strokeStyle = 'rgba(146,178,214,.10)';
  ctx.lineWidth = 3.5; ctx.stroke(G.outline);
  ctx.restore();

  // 空腔里的一点暖环境光，避免死黑
  var amb = ctx.createRadialGradient(G.cx, G.neckY, G.R * 0.1, G.cx, G.neckY, G.GH * 0.5);
  amb.addColorStop(0, 'rgba(198,142,64,.10)');
  amb.addColorStop(1, 'rgba(150,96,32,0)');
  ctx.fillStyle = amb;
  ctx.fillRect(0, 0, G.w, G.h);

  // 双条镜面高光带
  var hg = ctx.createLinearGradient(G.cx - G.R, 0, G.cx + G.R, 0);
  hg.addColorStop(0.00, 'rgba(255,255,255,0)');
  hg.addColorStop(0.09, 'rgba(255,255,255,.07)');
  hg.addColorStop(0.16, 'rgba(255,255,255,.21)');
  hg.addColorStop(0.23, 'rgba(255,255,255,.05)');
  hg.addColorStop(0.38, 'rgba(255,255,255,0)');
  hg.addColorStop(0.76, 'rgba(255,255,255,0)');
  hg.addColorStop(0.84, 'rgba(255,255,255,.115)');
  hg.addColorStop(0.90, 'rgba(255,255,255,.03)');
  hg.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, G.w, G.h);

  // 腔底焦散
  [G.gy0 + G.GH * 0.975, G.gy0 + G.GH * 0.025].forEach(function (y, i) {
    var cg = ctx.createRadialGradient(G.cx, y, 0, G.cx, y, G.R * 0.9);
    cg.addColorStop(0, 'rgba(255,240,210,' + (i ? .045 : .075) + ')');
    cg.addColorStop(1, 'rgba(255,240,210,0)');
    ctx.fillStyle = cg;
    ctx.fillRect(G.cx - G.R, y - G.R * 0.55, G.R * 2, G.R * 1.1);
  });
  ctx.restore();

  // 外轮廓：冷色玻璃边
  ctx.save();
  ctx.strokeStyle = 'rgba(196,220,246,.17)';
  ctx.lineWidth = 1.4; ctx.stroke(G.outline);
  ctx.strokeStyle = 'rgba(255,252,246,.26)';
  ctx.lineWidth = 0.6; ctx.stroke(G.outline);
  ctx.restore();

  // 左上前景高光
  ctx.save();
  ctx.clip(G.outline);
  var eg = ctx.createRadialGradient(
    G.cx - G.R * 0.40, G.gy0 + G.GH * 0.14, 0,
    G.cx - G.R * 0.40, G.gy0 + G.GH * 0.14, G.R * 0.75);
  eg.addColorStop(0, 'rgba(255,255,255,.16)');
  eg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(0, 0, G.w, G.h);
  ctx.restore();

  // 颈部金属箍
  var nw = G.R * prof(1) * 3.4, nh = Math.max(5, G.GH * 0.015);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 5;
  ctx.fillStyle = titanium(G.cx - nw / 2, G.cx + nw / 2, G.neckY);
  rrect(G.cx - nw / 2, G.neckY - nh / 2, nw, nh, nh / 2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  rrect(G.cx - nw / 2 + 1, G.neckY - nh / 2 + 1, nw - 2, nh * 0.3, nh * 0.15);
  ctx.fill();
}

/* ══════════════════════════════════════════════════════════════
   7. 主循环（按 delta-time，兼容 120Hz ProMotion）
   ══════════════════════════════════════════════════════════════ */
function frame(ts) {
  requestAnimationFrame(frame);
  var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0.016;
  lastTs = ts;

  // ── 进度来源：tween > 计时器 > 保持
  if (tween) {
    var k = Math.min(1, (ts - tween.t0) / tween.dur);
    var e = 1 - Math.pow(1 - k, 3);
    S.p = tween.from + (tween.to - tween.from) * e;
    if (k >= 1) tween = null;
  } else if (S.running) {
    // 关键：用时间戳算，不累加帧差 —— 切后台/锁屏回来也准
    var left = S.endAt - Date.now();
    if (left <= 0) { S.remainMs = 0; S.p = 1; finish(); }
    else { S.remainMs = left; S.p = 1 - left / S.totalMs; }
  }

  crater += ((S.running ? 1 : 0) - crater) * Math.min(1, dt * 3.2);
  tiltT  += (tiltG - tiltT) * Math.min(1, dt * 5.5);

  stepGrains(dt, S.p);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, G.w, G.h);
  drawGlow();
  drawPosts();
  drawCavity();
  drawTopSand(S.p);
  if (S.running) drawStream(S.p);
  drawPile(S.p);
  drawGrains();
  drawGlass();
  drawPlates();
}

/* ══════════════════════════════════════════════════════════════
   8. 计时器
   ══════════════════════════════════════════════════════════════ */
var elTime  = document.getElementById('time');
var elSub   = document.getElementById('subline');
var elMain  = document.getElementById('btnMain');
var elLabel = document.getElementById('mainLabel');
var elIcon  = document.getElementById('mainIcon');
var elHint  = document.getElementById('hint');

var ICON_PLAY  = 'M8 5.6c0-.9 1-1.5 1.8-1L19 10.3c.7.5.7 1.5 0 2L9.8 18c-.8.5-1.8-.1-1.8-1z';
var ICON_PAUSE = 'M7 4.6h3.1v14.8H7zM13.9 4.6H17v14.8h-3.1z';
var ICON_REDO  = 'M12 4a8 8 0 1 0 7.5 5.2l1.9-.7A10 10 0 1 1 12 2z';

function fmt(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var m = Math.floor(s / 60);
  s -= m * 60;
  if (m >= 60) {
    var hh = Math.floor(m / 60); m -= hh * 60;
    return hh + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function syncUI() {
  elTime.textContent = fmt(S.running ? S.endAt - Date.now() : S.remainMs);
  elTime.classList.toggle('done', S.done);

  if (S.done) {
    elLabel.textContent = '再来一次';
    elIcon.innerHTML = '<path d="' + ICON_REDO + '"/>';
    elMain.classList.remove('running');
  } else if (S.running) {
    elLabel.textContent = '暂停';
    elIcon.innerHTML = '<path d="' + ICON_PAUSE + '"/>';
    elMain.classList.add('running');
  } else {
    elLabel.textContent = S.remainMs < S.totalMs ? '继续' : '开始';
    elIcon.innerHTML = '<path d="' + ICON_PLAY + '"/>';
    elMain.classList.remove('running');
  }

  elSub.innerHTML = S.done
    ? '<b>时间到</b>'
    : (S.phase === 'break' ? '休息 · BREAK' : '专注 · FOCUS');
  elHint.style.opacity = S.running ? '0' : '1';
  save();
}

function start() {
  if (S.running) return;
  unlockAudio();
  if (S.done || S.remainMs <= 0) { S.remainMs = S.totalMs; S.p = 0; S.done = false; }
  S.endAt = Date.now() + S.remainMs;
  S.running = true;
  tween = null;
  requestWake();
  syncUI();
}

function pause() {
  if (!S.running) return;
  S.remainMs = Math.max(0, S.endAt - Date.now());
  S.running = false;
  releaseWake();
  syncUI();
}

function finish() {
  S.running = false;
  S.done = true;
  S.remainMs = 0;
  releaseWake();
  chime();
  syncUI();
  if (opt.pomo) setTimeout(nextPomo, 1500);
}

function nextPomo() {
  if (!opt.pomo || !S.done) return;
  var next = S.phase === 'focus' ? 'break' : 'focus';
  S.phase = next;
  setDuration(next === 'break' ? 5 : (S.presetMin || 25), true);
  doFlip(true);
}

function setDuration(min, keepPhase) {
  S.totalMs = Math.round(min * 60 * 1000);
  S.remainMs = S.totalMs;
  S.running = false;
  S.done = false;
  if (!keepPhase) { S.phase = 'focus'; S.presetMin = min; }
  releaseWake();
  tween = { from: S.p, to: 0, t0: performance.now(), dur: 460 };
  syncUI();
  markChips();
}

/* ══════════════════════════════════════════════════════════════
   9. 翻转
   ══════════════════════════════════════════════════════════════ */
function doFlip(autoStart) {
  if (flipping) return;
  flipping = true;
  var oldP = S.p;
  var wasRunning = S.running;
  S.running = false;
  releaseWake();

  stageEl.classList.add('flipping');
  rotDeg += 180;
  cv.style.transform = 'rotate(' + rotDeg + 'deg)';

  setTimeout(function () {
    // 归零旋转 —— 同时把 p 设成 1-oldP，视觉完全等价，无跳变
    stageEl.classList.remove('flipping');
    rotDeg = 0;
    cv.style.transform = 'rotate(0deg)';
    S.p = 1 - oldP;
    S.remainMs = S.totalMs;
    S.done = false;
    // 沙子"落定"回满
    tween = { from: S.p, to: 0, t0: performance.now(), dur: 520 };
    grains.length = 0;
    flipping = false;
    syncUI();
    if (autoStart || wasRunning) setTimeout(start, 300);
  }, 730);
}

/* ══════════════════════════════════════════════════════════════
   10. 提示音（iOS Safari 无震动 API，用 WebAudio 合成钟声）
   ══════════════════════════════════════════════════════════════ */
var AC = null;
function unlockAudio() {
  try {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C();
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}

function strike(t0, freq, gain, dur) {
  var o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';     o.frequency.value = freq;
  o2.type = 'sine';    o2.frequency.value = freq * 2.76;   // 钟的非谐泛音
  var g2 = AC.createGain(); g2.gain.value = 0.22;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AC.destination);
  o.start(t0);  o2.start(t0);
  o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
}

function chime() {
  if (!opt.sound) return;
  unlockAudio();
  if (!AC || AC.state !== 'running') return;
  var t = AC.currentTime + 0.02;
  strike(t,        660, 0.30, 2.4);
  strike(t + 0.42, 880, 0.24, 2.0);
  strike(t + 0.90, 660, 0.20, 2.8);
}

function tick() {                    // 轻微的操作反馈音
  if (!opt.sound || !AC || AC.state !== 'running') return;
  var t = AC.currentTime;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.value = 1180;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + 0.09);
}

/* ══════════════════════════════════════════════════════════════
   11. 屏幕常亮
   ══════════════════════════════════════════════════════════════ */
var wakeLock = null;
function requestWake() {
  if (!opt.wake || !('wakeLock' in navigator)) return;
  try {
    navigator.wakeLock.request('screen').then(function (w) {
      wakeLock = w;
      w.addEventListener('release', function () { wakeLock = null; });
    })['catch'](function () {});
  } catch (e) {}
}
function releaseWake() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}

/* ══════════════════════════════════════════════════════════════
   12. 传感器：物理翻转 + 重力倾斜
   iOS 13+ 必须在用户手势里请求权限，且必须 HTTPS。
   ══════════════════════════════════════════════════════════════ */
var needsPerm = typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function';
var motionOn = false;
var upsideSince = 0;

function onOrient(e) {
  if (e.gamma === null && e.beta === null) return;
  var gamma = e.gamma || 0, beta = e.beta || 0;
  // 左右倾 → 沙面倾角（限幅并衰减，太夸张就假了）
  var g = Math.max(-25, Math.min(25, gamma)) * 0.55;
  tiltG = g * Math.PI / 180;

  // 手机倒置持续 600ms → 翻转沙漏
  var upside = Math.abs(beta) > 148;
  if (upside) {
    if (!upsideSince) upsideSince = Date.now();
    else if (Date.now() - upsideSince > 600 && !flipping) {
      upsideSince = 0;
      doFlip(false);
      toast('已翻转');
    }
  } else upsideSince = 0;
}

function enableMotion(silent) {
  if (motionOn) return Promise.resolve(true);
  if (typeof DeviceOrientationEvent === 'undefined') {
    if (!silent) toast('本设备不支持重力感应');
    return Promise.resolve(false);
  }
  var go = function () {
    window.addEventListener('deviceorientation', onOrient, { passive: true });
    motionOn = true;
    return true;
  };
  if (!needsPerm) return Promise.resolve(go());
  return DeviceOrientationEvent.requestPermission().then(function (r) {
    if (r === 'granted') return go();
    if (!silent) toast('已拒绝动作权限');
    return false;
  })['catch'](function () {
    if (!silent) toast('需要 HTTPS 才能开启');
    return false;
  });
}

function disableMotion() {
  window.removeEventListener('deviceorientation', onOrient);
  motionOn = false; tiltG = 0; upsideSince = 0;
}

/* ══════════════════════════════════════════════════════════════
   13. 交互
   ══════════════════════════════════════════════════════════════ */
var elToast = document.getElementById('toast'), toastT = 0;
function toast(msg) {
  elToast.textContent = msg;
  elToast.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function () { elToast.classList.remove('show'); }, 1900);
}

elMain.addEventListener('click', function () {
  unlockAudio(); tick();
  if (S.done) doFlip(true);
  else if (S.running) pause();
  else start();
});

document.getElementById('btnFlip').addEventListener('click', function () {
  unlockAudio(); tick(); doFlip(false);
});

/* 舞台手势：轻点 = 开始/暂停；下滑 = 翻转 */
(function () {
  var sx = 0, sy = 0, st = 0, moved = false;
  stageEl.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false;
  }, { passive: true });

  stageEl.addEventListener('touchmove', function (e) {
    var t = e.changedTouches[0];
    if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) moved = true;
  }, { passive: true });

  stageEl.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dy = t.clientY - sy, dx = t.clientX - sx, dur = Date.now() - st;
    unlockAudio();
    if (dy > 55 && Math.abs(dx) < 70 && dur < 700) { tick(); doFlip(false); return; }
    if (!moved && dur < 400) { tick(); S.done ? doFlip(true) : (S.running ? pause() : start()); }
  }, { passive: true });

  // 桌面：点击 = 开始/暂停
  stageEl.addEventListener('click', function (e) {
    if (e.detail === 0) return;
    if ('ontouchstart' in window) return;
    unlockAudio(); tick();
    S.done ? doFlip(true) : (S.running ? pause() : start());
  });
})();

/* ── 预设时长 ── */
var PRESETS = [1, 3, 5, 10, 25, 45];
var elPresets = document.getElementById('presets');
(function buildChips() {
  PRESETS.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'chip'; b.dataset.min = m;
    b.innerHTML = m + '<small>分</small>';
    b.addEventListener('click', function () { unlockAudio(); tick(); setDuration(m); });
    elPresets.appendChild(b);
  });
  var c = document.createElement('button');
  c.className = 'chip'; c.id = 'chipCustom'; c.textContent = '自定义';
  c.addEventListener('click', function () { unlockAudio(); tick(); openSheet('sheetCustom'); });
  elPresets.appendChild(c);
})();

function markChips() {
  var min = S.totalMs / 60000;
  var hit = false;
  [].forEach.call(elPresets.querySelectorAll('.chip[data-min]'), function (b) {
    var on = Math.abs(+b.dataset.min - min) < 0.001;
    b.classList.toggle('on', on);
    if (on) hit = true;
  });
  var cc = document.getElementById('chipCustom');
  cc.classList.toggle('on', !hit);
  cc.textContent = hit ? '自定义' : (Math.round(min * 10) / 10) + ' 分';
}

/* ── 抽屉 ── */
var scrim = document.getElementById('scrim');
var sheets = { sheetCustom: document.getElementById('sheetCustom'),
               sheetSettings: document.getElementById('sheetSettings') };
function openSheet(id) {
  scrim.classList.add('show');
  sheets[id].classList.add('show');
}
function closeSheets() {
  scrim.classList.remove('show');
  for (var k in sheets) sheets[k].classList.remove('show');
}
scrim.addEventListener('click', closeSheets);

/* 自定义时长 */
var dialNum = document.getElementById('dialNum');
var dialRange = document.getElementById('dialRange');
var dialVal = 30;
function setDial(v) {
  dialVal = Math.max(1, Math.min(180, Math.round(v)));
  dialNum.textContent = dialVal;
  dialRange.value = dialVal;
}
document.getElementById('dialMinus').addEventListener('click', function () { setDial(dialVal - 1); tick(); });
document.getElementById('dialPlus').addEventListener('click', function () { setDial(dialVal + 1); tick(); });
dialRange.addEventListener('input', function () { setDial(+dialRange.value); });
document.getElementById('customDone').addEventListener('click', function () {
  setDuration(dialVal); closeSheets(); tick();
});

/* 设置 */
document.getElementById('btnSettings').addEventListener('click', function () {
  unlockAudio(); tick(); openSheet('sheetSettings');
});
document.getElementById('setDone').addEventListener('click', function () { closeSheets(); tick(); });

function bindSwitch(id, key, onChange) {
  var el = document.getElementById(id);
  function toggle() {
    var next = !opt[key];
    if (onChange) {
      var r = onChange(next);
      if (r && typeof r.then === 'function') {
        r.then(function (ok) { opt[key] = ok; el.classList.toggle('on', ok); save(); });
        return;
      }
      if (r === false) { el.classList.remove('on'); opt[key] = false; save(); return; }
    }
    opt[key] = next;
    el.classList.toggle('on', next);
    save();
  }
  el.addEventListener('click', function () { tick(); toggle(); });
  el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  return el;
}

var swMotion = bindSwitch('swMotion', 'motion', function (next) {
  if (!next) { disableMotion(); return false; }
  return enableMotion(false);
});
bindSwitch('swSound', 'sound', function (next) { if (next) unlockAudio(); return next; });
bindSwitch('swPomo', 'pomo');
bindSwitch('swWake', 'wake', function (next) {
  if (next) { if (S.running) requestWake(); } else releaseWake();
  return next;
});

/* ══════════════════════════════════════════════════════════════
   14. 持久化 —— 关掉 Safari 再打开能接着走
   ══════════════════════════════════════════════════════════════ */
var KEY = 'hourglass.v1';
var lastSave = 0;
function save(force) {
  var now = Date.now();
  if (!force && now - lastSave < 1500) return;   // 同步写，节流避免掉帧
  lastSave = now;
  try {
    localStorage.setItem(KEY, JSON.stringify({
      totalMs: S.totalMs, remainMs: S.remainMs, endAt: S.endAt,
      running: S.running, done: S.done, phase: S.phase, presetMin: S.presetMin,
      opt: opt, dial: dialVal
    }));
  } catch (e) {}
}

function load() {
  var raw;
  try { raw = localStorage.getItem(KEY); } catch (e) { return; }
  if (!raw) return;
  var d;
  try { d = JSON.parse(raw); } catch (e) { return; }
  if (!d || typeof d.totalMs !== 'number') return;

  S.totalMs   = d.totalMs;
  S.phase     = d.phase === 'break' ? 'break' : 'focus';
  S.presetMin = d.presetMin || 25;
  if (d.opt) for (var k in opt) if (k in d.opt) opt[k] = !!d.opt[k];
  if (typeof d.dial === 'number') setDial(d.dial);

  if (d.running && typeof d.endAt === 'number') {
    var left = d.endAt - Date.now();
    if (left > 0) {                       // 还没到点 → 无缝续上
      S.endAt = d.endAt; S.remainMs = left; S.running = true; S.done = false;
      S.p = 1 - left / S.totalMs;
      requestWake();
    } else {                              // 离开期间就到点了
      S.remainMs = 0; S.running = false; S.done = true; S.p = 1;
    }
  } else {
    S.remainMs = typeof d.remainMs === 'number' ? d.remainMs : d.totalMs;
    S.done = !!d.done;
    S.p = S.done ? 1 : 1 - S.remainMs / S.totalMs;
  }

  // 开关回填
  document.getElementById('swSound').classList.toggle('on', opt.sound);
  document.getElementById('swPomo').classList.toggle('on', opt.pomo);
  document.getElementById('swWake').classList.toggle('on', opt.wake);
  swMotion.classList.toggle('on', false);   // 动作权限每次都要用户手势重新授予
  opt.motion = false;
}

/* ══════════════════════════════════════════════════════════════
   15. 生命周期
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') {
    if (S.running) {
      var left = S.endAt - Date.now();
      if (left <= 0) finish(); else { S.remainMs = left; requestWake(); }
    }
    syncUI();
  } else { save(true); }
});
window.addEventListener('pagehide', function () { save(true); });

var rzT = 0;
window.addEventListener('resize', function () {
  clearTimeout(rzT);
  rzT = setTimeout(function () { layout(); }, 120);
});
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { layout(); }, 120);
  });
}

// 每秒刷新读数（渲染是 rAF，读数只需 1Hz）
setInterval(function () { if (S.running) syncUI(); }, 250);

// 键盘（桌面调试友好）
window.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); unlockAudio(); S.running ? pause() : start(); }
  if (e.key === 'f' || e.key === 'F') doFlip(false);
});

/* ══════════════════════════════════════════════════════════════
   16. 启动
   ══════════════════════════════════════════════════════════════ */
if (!('ontouchstart' in window) && !navigator.maxTouchPoints) {
  elHint.textContent = '点击沙漏开始 · 空格暂停 · F 翻转';
}

setDial(30);
layout();
load();
markChips();
syncUI();

// 不支持传感器时把设置项标灰说明原因
if (typeof DeviceOrientationEvent === 'undefined') {
  swMotion.classList.add('disabled');
  document.getElementById('motionSub').textContent = '本设备不支持动作传感器';
} else if (needsPerm && location.protocol !== 'https:' && location.hostname !== 'localhost') {
  document.getElementById('motionSub').textContent = '需通过 HTTPS 打开才能授权';
}
if (!('wakeLock' in navigator)) {
  document.getElementById('swWake').classList.add('disabled');
  document.getElementById('wakeSub').textContent = '当前浏览器不支持，请手动关闭自动锁屏';
}

requestAnimationFrame(frame);

/* 调试钩子：Playwright 用它验证各进度下的渲染与计时准确性 */
window.__hg = {
  setP: function (p) { tween = null; S.running = false; S.p = Math.max(0, Math.min(1, p));
                       S.remainMs = S.totalMs * (1 - S.p);
                       S.done = S.p >= 0.9999; syncUI(); },
  state: function () { return { p: S.p, running: S.running, done: S.done,
                                remainMs: S.remainMs, totalMs: S.totalMs, text: elTime.textContent }; },
  start: start, pause: pause, flip: doFlip, setDuration: setDuration,
  geom: function () { return { GH: G.GH, R: G.R, neckY: G.neckY, A: A_TOTAL,
                               dpr: dpr, cw: cv.width, ch: cv.height }; },
  topLevelT: topLevelT, pileHeight: pileHeight
};

})();
</script>
</body>
</html>
