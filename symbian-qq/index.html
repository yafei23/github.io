<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手机QQ 2013 塞班版 · 界面复刻</title>
<style>
/* ============================================================
   手机QQ 2013 (Symbian S60v5) 界面复刻
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --qq-l:#5cbdf0;          /* 标题栏浅 */
  --qq-d:#1a80c4;          /* 标题栏深 */
  --sel-l:#8ed3f7;         /* S60 高亮浅 */
  --sel-d:#2589cf;         /* S60 高亮深 */
  --line:#d6e1ea;
  --txt:#1d2429;
  --gray:#7b8a96;
  --font:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC","WenQuanYi Micro Hei",sans-serif;
}

html,body{height:100%}
body{
  background:#181c20;
  background-image:radial-gradient(circle at 50% 22%,#2f3740 0%,#14181c 62%,#0c0e11 100%);
  font-family:var(--font);
  color:#c9d2da;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:14px 8px 26px;
  overflow-x:hidden;
}

/* ---------- 缩放舞台 ---------- */
#stage{transform-origin:top center}

/* ============================================================
   诺基亚机身
   ============================================================ */
#phone{
  width:428px;height:800px;position:relative;
  border-radius:38px;
  background:linear-gradient(160deg,#5a6068 0%,#33383e 14%,#24282d 48%,#1b1e22 82%,#3a4046 100%);
  box-shadow:
    0 0 0 1px #0a0c0e,
    0 2px 0 1px rgba(255,255,255,.09) inset,
    0 30px 60px rgba(0,0,0,.62),
    0 4px 12px rgba(0,0,0,.5);
  padding:56px 34px 0;
}
#phone.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(3px)}
  30%,50%,70%{transform:translateX(-5px)}
  40%,60%{transform:translateX(5px)}
}
.brand{
  position:absolute;top:20px;left:0;right:0;text-align:center;
  font:600 12px/1 var(--font);letter-spacing:4.5px;color:#a9b3bd;
  text-shadow:0 1px 0 #000;
}
.earpiece{
  position:absolute;top:38px;left:50%;transform:translateX(-50%);
  width:70px;height:6px;border-radius:3px;
  background:linear-gradient(#0c0e10,#191d21);
  box-shadow:0 1px 0 rgba(255,255,255,.09);
}
.frontcam{
  position:absolute;top:36px;left:96px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3b4a5a,#0a0d10 70%);
  box-shadow:0 0 0 1px #000,0 0 3px rgba(90,150,200,.5) inset;
}
.sensor{position:absolute;top:39px;right:98px;width:5px;height:5px;border-radius:50%;background:#0d1013}

/* 屏幕边框 */
.bezel{
  width:360px;height:640px;margin:0 auto;
  background:#000;border-radius:4px;
  box-shadow:0 0 0 4px #101317,0 0 0 5px #3d444c,0 0 22px rgba(0,0,0,.8) inset;
}
#screen{
  width:360px;height:640px;position:relative;overflow:hidden;
  background:#eef3f7;color:var(--txt);
  display:flex;flex-direction:column;
  font-size:13px;line-height:1.35;
  user-select:none;
}

/* 机身按键 */
.keys{
  position:absolute;bottom:0;left:0;right:0;height:104px;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
.key{
  border:none;cursor:pointer;font-family:var(--font);
  background:linear-gradient(#464c53,#23272c);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 2px 5px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
}
.key:active{transform:translateY(1px);filter:brightness(.85)}
.key.side{width:74px;height:34px;border-radius:17px}
.key.mid{width:60px;height:38px;border-radius:19px;
  background:linear-gradient(#575e66,#2c3138)}
.key svg{width:22px;height:22px;display:block}
.speaker{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:46px;height:4px;border-radius:2px;background:#0d1013;
}

/* ============================================================
   状态栏 (S60v5)
   ============================================================ */
#statusbar{
  height:22px;flex:0 0 22px;display:flex;align-items:center;gap:5px;
  padding:0 5px;font-size:11px;color:#20303c;
  background:linear-gradient(#f6fbff,#d9e6f0 60%,#cbdae6);
  border-bottom:1px solid #a9bdcd;
}
#statusbar .op{font-size:11px;color:#25404f;letter-spacing:.3px}
#statusbar .sp{flex:1}
.bars{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.bars i{width:3px;background:#2a4457;border-radius:.5px;display:block}
.bars i:nth-child(1){height:3px}
.bars i:nth-child(2){height:5px}
.bars i:nth-child(3){height:7px}
.bars i:nth-child(4){height:9px}
.bars i:nth-child(5){height:11px;background:#9db1c0}
.gprs{font:700 9px/1 var(--font);color:#2a4457;border:1px solid #7e95a6;border-radius:2px;padding:1px 2px}
.batt{width:22px;height:11px;border:1px solid #2a4457;border-radius:2px;position:relative;padding:1px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#2a4457;border-radius:0 1px 1px 0}
.batt b{display:block;height:100%;width:72%;background:#3b7d3b;border-radius:1px}

/* ============================================================
   视图区
   ============================================================ */
#view{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff}

/* 软键栏 */
#softbar{
  height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;
  padding:0 9px;font-size:12.5px;color:#16333f;
  background:linear-gradient(#eef5fa,#cfdde8 55%,#bccdda);
  border-top:1px solid #9db2c2;
}
#softbar button{
  border:none;background:none;font:inherit;color:#123340;cursor:pointer;
  padding:5px 7px;border-radius:3px;min-width:52px;
}
#softbar button:empty{visibility:hidden}
#softbar button:active{background:rgba(37,137,207,.28)}
#softbar .lsk{text-align:left}
#softbar .rsk{text-align:right}
#softbar .csk{font-size:11px;color:#4a6577}

/* ---------- 通用列表 ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-track{background:#e3ebf1}
.scroll::-webkit-scrollbar-thumb{background:linear-gradient(#8fcbf0,#3d94cf);border-radius:3px}
.item{cursor:pointer;position:relative}
.item.sel{
  background:linear-gradient(var(--sel-l),var(--sel-d))!important;
  color:#fff;
}
.item.sel .sub,.item.sel .tm,.item.sel .cnt,.item.sel .sign{color:#e6f5ff}

/* 标题栏 */
.titlebar{
  height:30px;flex:0 0 30px;display:flex;align-items:center;gap:6px;padding:0 8px;
  background:linear-gradient(var(--qq-l),var(--qq-d));
  color:#fff;font-size:13.5px;font-weight:700;
  border-bottom:1px solid #14648f;
  text-shadow:0 1px 1px rgba(0,0,0,.28);
}
.titlebar .r{margin-left:auto;font-weight:400;font-size:11.5px;opacity:.92}

/* ============================================================
   开机 / 待机 / 主菜单
   ============================================================ */
#view.boot{background:#000;align-items:center;justify-content:center}
.bootlogo{
  color:#fff;font:600 30px/1 var(--font);letter-spacing:9px;
  text-shadow:0 0 22px rgba(160,200,255,.6);
  animation:fadein 1s ease both;
}
.boothands{margin-top:14px;font-size:11px;color:#8fa4b6;letter-spacing:2px;animation:fadein 1.6s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.standby{
  flex:1;display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.20),transparent 60%),
    linear-gradient(#1f5c96 0%,#2d84c4 38%,#7fc0e6 72%,#c9e6f5 100%);
  position:relative;color:#fff;
}
.standby .carrier{margin-top:8px;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.standby .clock{margin-top:34px;font:200 62px/1 var(--font);letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.standby .date{margin-top:8px;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.standby .lock{margin-top:auto;margin-bottom:16px;font-size:11px;opacity:.9}
.standby .shortcuts{display:flex;gap:26px;margin-bottom:14px}
.standby .sc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.standby .sc svg{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}

.grid{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;padding:10px 8px;align-content:start;
  background:linear-gradient(#dfe9f1,#b9cbd9);
}
.gicon{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 2px 9px;border-radius:5px;cursor:pointer;font-size:11px;color:#17323f;
}
.gicon.sel{background:linear-gradient(var(--sel-l),var(--sel-d));color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.gicon svg{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}

/* ============================================================
   QQ 启动 / 登录
   ============================================================ */
.qqsplash{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(#eaf6fe 0%,#c3e4fa 55%,#9ed3f5 100%);position:relative;
}
.qqsplash .logo svg{width:96px;height:96px;filter:drop-shadow(0 5px 8px rgba(0,60,110,.3))}
.qqsplash .qqname{margin-top:12px;font:700 24px/1 var(--font);color:#0e6ba6;letter-spacing:3px;text-shadow:0 1px 0 #fff}
.qqsplash .ver{margin-top:7px;font-size:11.5px;color:#3d7ea6}
.qqsplash .cprt{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10px;color:#4b7f9e;line-height:1.6}

.login{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 26px 0;
  background:linear-gradient(#f2fafe,#d3ebfa 70%,#bfe2f7)}
.login .plogo svg{width:62px;height:62px}
.login .ttl{margin:6px 0 18px;font:700 15px/1 var(--font);color:#0e6ba6;letter-spacing:2px}
.field{width:100%;margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:#3f7291;margin-bottom:4px}
.field .box{
  display:flex;align-items:center;height:34px;padding:0 9px;gap:7px;
  background:#fff;border:1px solid #7fadc9;border-radius:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.10) inset;
}
.field .box svg{width:16px;height:16px;flex:0 0 16px;opacity:.8}
.field input{border:none;outline:none;flex:1;font:14px var(--font);color:#12303f;background:none;letter-spacing:1px}
.field input::placeholder{color:#9fb6c4;letter-spacing:0}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:#2c5b76;cursor:pointer;margin-bottom:9px;width:100%}
.chk .b{width:13px;height:13px;border:1px solid #6b9cbb;background:#fff;border-radius:2px;display:flex;align-items:center;justify-content:center;flex:0 0 13px}
.chk .b.on::after{content:"";width:7px;height:4px;border-left:2px solid #157fbd;border-bottom:2px solid #157fbd;transform:rotate(-45deg) translate(1px,-1px)}
.stsel{
  width:100%;height:32px;display:flex;align-items:center;gap:7px;padding:0 9px;margin-bottom:16px;
  background:#fff;border:1px solid #7fadc9;border-radius:3px;font-size:12.5px;color:#12303f;cursor:pointer;
}
.stsel .arr{margin-left:auto;color:#5b8ba8;font-size:10px}
.btn{
  width:100%;height:36px;border:1px solid #1974ad;border-radius:4px;cursor:pointer;
  background:linear-gradient(#7fd0f7,#2a95d8 52%,#1b7fc2);
  color:#fff;font:700 14px/1 var(--font);letter-spacing:4px;
  text-shadow:0 1px 1px rgba(0,0,0,.3);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 4px rgba(0,0,0,.22);
}
.btn:active{background:linear-gradient(#2a95d8,#7fd0f7);transform:translateY(1px)}

.logging{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(#f2fafe,#cbe8fa)}
.logging .logo svg{width:76px;height:76px;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}
.logging .tip{font-size:12.5px;color:#26688f}
.pbar{width:190px;height:11px;border:1px solid #6ea6c8;border-radius:6px;background:#fff;padding:1px;overflow:hidden}
.pbar b{display:block;height:100%;width:0;border-radius:5px;
  background:linear-gradient(#8fd9ff,#2a95d8);transition:width .28s linear}

/* ============================================================
   QQ 主界面
   ============================================================ */
.me{
  flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:linear-gradient(#5fc0f2,#2189cb 62%,#1878b4);
  border-bottom:1px solid #12648f;color:#fff;
}
.me .avaw{position:relative;flex:0 0 44px}
.me .avaw svg{width:44px;height:44px;border-radius:4px;background:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.75),0 1px 3px rgba(0,0,0,.35)}
.me .info{flex:1;min-width:0}
.me .l1{display:flex;align-items:center;gap:5px}
.me .nick{font-size:13.5px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.3);
  max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .lvl{display:flex;gap:2px;align-items:center}
.me .lvl svg{width:12px;height:12px}
.me .st{
  margin-left:auto;font-size:11px;background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.45);border-radius:3px;padding:2px 5px;cursor:pointer;white-space:nowrap;
}
.me .sign{font-size:11px;color:#d9f0ff;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tabs{flex:0 0 40px;display:flex;background:linear-gradient(#f4f9fc,#dbe7ef);border-bottom:1px solid #a9bdcd}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:#3b5c70;cursor:pointer;border-right:1px solid #c6d5e0;position:relative;
}
.tab:last-child{border-right:none}
.tab svg{width:17px;height:17px}
.tab.on{background:linear-gradient(var(--sel-l),var(--sel-d));color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tab .nb{
  position:absolute;top:3px;right:12px;min-width:14px;height:14px;border-radius:7px;
  background:linear-gradient(#ff6b5e,#d92116);color:#fff;font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  box-shadow:0 1px 2px rgba(0,0,0,.35);border:1px solid #fff;
}

/* 会话 / 好友 行 */
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid #eaf0f5;background:#fff}
.row:nth-child(even){background:#f7fbfe}
.row .avaw{position:relative;flex:0 0 38px;height:38px}
.row .avaw svg{width:38px;height:38px;border-radius:3px;box-shadow:0 0 0 1px #cfdde7}
.row.off .avaw svg{filter:grayscale(1) opacity(.62)}
.row .badge{
  position:absolute;top:-4px;right:-5px;min-width:16px;height:16px;border-radius:8px;
  background:linear-gradient(#ff6f61,#d61f14);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:1px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.35)
}
.row .col{flex:1;min-width:0}
.row .r1{display:flex;align-items:center;gap:4px}
.row .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.row .mob{width:9px;height:13px;flex:0 0 9px}
.row .tm{margin-left:auto;font-size:10.5px;color:var(--gray);flex:0 0 auto}
.row .sub{font-size:11.5px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* 分组标题 */
.grph{
  display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12.5px;font-weight:700;color:#1d4a63;
  background:linear-gradient(#e6eef4,#d2dfe9);border-bottom:1px solid #b9c9d6;border-top:1px solid #fff;
}
.grph .tri{font-size:9px;width:10px;color:#2f6d92}
.grph .cnt{margin-left:auto;font-size:11px;color:#5a7c90;font-weight:400}

/* 动态 */
.feed{padding:8px;border-bottom:1px solid #e6edf3;background:#fff;display:flex;gap:8px}
.feed:nth-child(even){background:#f7fbfe}
.feed .avaw{flex:0 0 32px}
.feed .avaw svg{width:32px;height:32px;border-radius:3px;box-shadow:0 0 0 1px #cfdde7}
.feed .nm{font-size:12px;font-weight:700;color:#1c5f8c}
.feed .txt{font-size:12px;margin-top:3px;line-height:1.5;color:#26333c}
.feed .bar{display:flex;gap:12px;margin-top:5px;font-size:10.5px;color:var(--gray);align-items:center}
.feed .bar svg{width:11px;height:11px;vertical-align:-1px;margin-right:2px}

/* ============================================================
   聊天窗口
   ============================================================ */
.msgs{
  flex:1;overflow-y:auto;padding:8px 7px 10px;
  background:linear-gradient(#f3f9fd,#e6f1f9);
}
.msgs::-webkit-scrollbar{width:6px}
.msgs::-webkit-scrollbar-track{background:#e3ebf1}
.msgs::-webkit-scrollbar-thumb{background:linear-gradient(#8fcbf0,#3d94cf);border-radius:3px}
.tsep{text-align:center;font-size:10.5px;color:#8ba1b0;margin:6px 0 9px}
.msg{display:flex;gap:6px;margin-bottom:10px;align-items:flex-start}
.msg .a{flex:0 0 32px}
.msg .a svg{width:32px;height:32px;border-radius:3px;box-shadow:0 0 0 1px #c3d4e0}
.msg .body{max-width:238px}
.msg .who{font-size:10.5px;color:#5b7f95;margin-bottom:3px}
.bub{
  position:relative;padding:6px 9px;border-radius:5px;font-size:12.5px;line-height:1.55;
  word-break:break-word;white-space:pre-wrap;
}
.msg.them .bub{background:#fff;border:1px solid #c3d4e0;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg.them .bub::before{
  content:"";position:absolute;left:-6px;top:9px;width:0;height:0;
  border:5px solid transparent;border-right-color:#c3d4e0;
}
.msg.them .bub::after{
  content:"";position:absolute;left:-4px;top:9px;width:0;height:0;
  border:5px solid transparent;border-right-color:#fff;
}
.msg.mine{flex-direction:row-reverse}
.msg.mine .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.mine .bub{
  background:linear-gradient(#d3f0ff,#a9dcf8);border:1px solid #6fb8de;color:#0e2f42;
  box-shadow:0 1px 1px rgba(0,0,0,.06)
}
.msg.mine .bub::before{
  content:"";position:absolute;right:-6px;top:9px;width:0;height:0;
  border:5px solid transparent;border-left-color:#6fb8de;
}
.msg.mine .bub::after{
  content:"";position:absolute;right:-4px;top:9px;width:0;height:0;
  border:5px solid transparent;border-left-color:#b8e3f9;
}
svg.emo{width:16px;height:16px;vertical-align:-3px;margin:0 1px}
.bub svg.emo{width:18px;height:18px;vertical-align:-4px}
.typing{font-size:11px;color:#5b7f95;padding:0 4px 8px}
.typing i{display:inline-block;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.inputbar{
  flex:0 0 40px;display:flex;align-items:center;gap:6px;padding:0 7px;
  background:linear-gradient(#fbfdff,#e8f1f7);border-top:1px solid #a9bdcd;
}
.inputbar .emobtn{width:26px;height:26px;flex:0 0 26px;cursor:pointer;border:none;background:none;padding:0}
.inputbar .emobtn svg{width:24px;height:24px}
.inputbar input{
  flex:1;height:26px;border:1px solid #8fb4cb;border-radius:3px;padding:0 7px;
  font:12.5px var(--font);color:#12303f;outline:none;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08) inset;
}
.inputbar .send{
  flex:0 0 46px;height:26px;border:1px solid #1974ad;border-radius:3px;cursor:pointer;
  background:linear-gradient(#7fd0f7,#2189cb);color:#fff;font:12px var(--font);
  text-shadow:0 1px 1px rgba(0,0,0,.25);
}
.inputbar .send:active{transform:translateY(1px)}

.emopanel{

/* ---------- 声音（经典“嘀嘀”提示音，WebAudio 合成） ---------- */
var AC = null;
function beep(){
  if(!S.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.16].forEach(function(off){
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + off;
      o.type = 'square'; o.frequency.setValueAtTime(1180, t);
      o.frequency.setValueAtTime(940, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.14);
    });
  }catch(e){}
}

  S.screen = p.screen; S.tab = p.tab; S.sel = p.sel; S.chat = p.chat; S.emo = false;
  render();
}

  var oldInp = view.querySelector('#in-msg');

      view.className = 'boot';
      h = '<div class="bootlogo">NOKIA</div><div class="boothands">Connecting People</div>';
      lsk = ''; rsk = '';
      break;

    case 'standby':

      break;

    case 'appmenu':
      view.className = '';
      h = renderAppMenu(); lsk = '选项'; rsk = '返回';
      break;

    case 'qqsplash':
      view.className = '';
      h = renderSplash(); lsk = ''; rsk = '';
      break;

    case 'login':
      view.className = '';
      h = renderLogin(); lsk = '登录'; rsk = '退出';
      break;

    case 'logging':
      view.className = '';
      h = renderLogging(); lsk = ''; rsk = '取消';
      break;

    case 'main':
      view.className = '';
      h = renderMain(); lsk = '选项'; rsk = '退出';
      break;

    case 'chat':
      view.className = '';
      h = renderChat(); lsk = '选项'; rsk = '返回';
      break;

    case 'profile':
      view.className = '';
      h = renderProfile(); lsk = '选项'; rsk = '返回';
      break;

    case 'about':
      view.className = '';
      h = renderAbout(); lsk = ''; rsk = '返回';
      break;
  }

  view.innerHTML = h;
  lskB.textContent = lsk; rskB.textContent = rsk;
  cskB.textContent = (S.screen === 'main' || S.screen === 'chat') ? '' : '';

  /* 覆盖层 */
  var old = screenEl.querySelector('.mask'); if(old) old.remove();
  old = screenEl.querySelector('.popmenu'); if(old) old.remove();
  old = screenEl.querySelector('.dialog'); if(old) old.remove();

  if(S.menu){
    var mask = document.createElement('div'); mask.className = 'mask';
    mask.addEventListener('click', function(){ S.menu = null; render(); });
    screenEl.appendChild(mask);

    var pm = document.createElement('div'); pm.className = 'popmenu';
    pm.innerHTML = S.menu.items.map(function(it,i){
      return '<div class="mi'+(i===S.menu.sel?' sel':'')+'" data-mi="'+i+'">'+esc(it)+'</div>';
    }).join('');
    screenEl.appendChild(pm);
    lskB.textContent = '选择'; rskB.textContent = '返回';
  }
  if(S.dialog){
    var mask2 = document.createElement('div'); mask2.className = 'mask';
    screenEl.appendChild(mask2);
    var dg = document.createElement('div'); dg.className = 'dialog';
    dg.innerHTML = '<div class="dt">'+esc(S.dialog.title)+'</div><div class="db">'+S.dialog.text+'</div>';
    screenEl.appendChild(dg);
    lskB.textContent = S.dialog.yes || '是';
    rskB.textContent = S.dialog.no  || '否';
  }

  applySel();
  if(S.screen === 'chat'){
    var m = view.querySelector('.msgs');
    if(m) m.scrollTop = m.scrollHeight;
  }
}

/* ============================================================
   6. 选中项（S60 高亮 + 方向键）
   ============================================================ */
function items(){
  if(S.menu) return [];
  return Array.prototype.slice.call(view.querySelectorAll('.item'));
}
function applySel(){
  var its = items();
  if(!its.length) return;
  if(S.sel >= its.length) S.sel = its.length - 1;
  if(S.sel < 0) S.sel = 0;
  its.forEach(function(el,i){ el.classList.toggle('sel', i === S.sel); });
  var cur = its[S.sel];
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}
function moveSel(d){
  if(S.menu){
    S.menu.sel = (S.menu.sel + d + S.menu.items.length) % S.menu.items.length;
    render(); return;
  }
  var its = items();
  if(!its.length){
    /* 聊天窗口没有列表项，方向键改为滚动消息 */
    var m = view.querySelector('.msgs');
    if(m) m.scrollTop += d * 48;
    return;
  }
  S.sel = (S.sel + d + its.length) % its.length;
  applySel();
}

/* ============================================================
   7. 交互
   ============================================================ */
function openChat(id){
  var c = CONVS.filter(function(x){ return x.id === id; })[0];
  if(c) c.unread = 0;
  if(!CHATS[id]) CHATS[id] = [];
  S.draft = '';
  go('chat', {chat:id});
}

function pushMsg(id, m){
  if(!CHATS[id]) CHATS[id] = [];
  CHATS[id].push(m);
  var c = CONVS.filter(function(x){ return x.id === id; })[0];
  var tm = nowHM();
  if(!c){ c = {id:id, last:'', tm:tm, unread:0}; CONVS.unshift(c); }
  c.last = (m.who ? m.who+'：' : '') + m.x;
  c.tm = tm;
  /* 置顶 */
  CONVS = CONVS.filter(function(x){ return x !== c; });
  CONVS.unshift(c);
}

function send(){
  var inp = view.querySelector('#in-msg');
  if(!inp) return;
  var t = inp.value.trim();
  if(!t){ toast('请输入内容'); return; }
  pushMsg(S.chat, {me:1, x:t});
  inp.value = ''; S.draft = '';
  S.emo = false;
  render();
  autoReply(S.chat);
}

var replyIdx = {};
function autoReply(id){
  var list = REPLIES[id];
  if(!list || !list.length) return;
  var box = view.querySelector('#typing');
  if(box) box.innerHTML = '<div class="typing">对方正在输入<i>.</i><i>.</i><i>.</i></div>';
  var m = view.querySelector('.msgs'); if(m) m.scrollTop = m.scrollHeight;

  setTimeout(function(){
    replyIdx[id] = (replyIdx[id] || 0);
    var who = FRIENDS[id].isGroup ? ['班长-王强','▔氺瀦鈤誋','梦琪ヽ浅唱那伤'][replyIdx[id] % 3] : null;
    var msg = {me:0, x:list[replyIdx[id] % list.length]};
    if(who) msg.who = who;
    replyIdx[id]++;
    pushMsg(id, msg);
    beep();
    if(S.screen === 'chat' && S.chat === id){
      render();
    }else{
      var c = CONVS.filter(function(x){ return x.id === id; })[0];
      if(c) c.unread++;
      vibrate(); render();
    }
  }, 900 + Math.random()*900);
}

/* ---------- 选项菜单 ---------- */
function openMenu(kind){
  var its;
  if(S.screen === 'main' && S.tab === 'msg')          its = ['发送消息','删除该聊天','设为置顶','全部标记为已读','系统设置','关于手机QQ','退出'];
  else if(S.screen === 'main' && S.tab === 'contact') its = ['发送消息','查看资料','修改备注姓名','移动联系人至','删除好友','添加好友','刷新好友列表','退出'];
  else if(S.screen === 'main' && S.tab === 'group')   its = ['进入群聊','查看群资料','群消息设置','退出该群','退出'];
  else if(S.screen === 'main')                        its = ['查看详情','评论','赞','刷新动态','退出'];
  else if(S.screen === 'chat')                        its = ['发送','插入表情','查看资料','清空聊天记录','消息提示音：'+(S.sound?'开':'关'),'返回'];
  else if(S.screen === 'appmenu')                     its = ['打开','移动','排序方式','存储卡','设置'];
  else if(S.screen === 'profile')                     its = ['发送消息','修改备注','进入QQ空间','删除好友','返回'];
  else                                                its = ['帮助','关于','退出'];
  S.menu = {items:its, sel:0, kind:kind};
  render();
}

function runMenu(label){
  S.menu = null;
  switch(label){
    case '发送消息': case '进入群聊':
      var its = items(), el = its[S.sel];
      if(el && el.dataset.id) openChat(el.dataset.id); else { render(); toast('请先选择联系人'); }
      return;
    case '查看资料': case '查看群资料': case '查看详情': {
      var el2 = items()[S.sel];
      if(el2 && el2.dataset.id) go('profile', {chat:el2.dataset.id});
      else if(S.screen === 'chat') go('profile', {chat:S.chat});
      else { render(); toast('请先选择联系人'); }
      return;
    }
    case '全部标记为已读':
      CONVS.forEach(function(c){ c.unread = 0; });
      render(); toast('已全部标记为已读'); return;
    case '清空聊天记录':
      CHATS[S.chat] = []; render(); toast('聊天记录已清空'); return;
    case '插入表情':
      S.emo = true; render(); return;
    case '发送': render(); send(); return;
    case '刷新好友列表':
      render(); toast('正在刷新…');
      setTimeout(function(){ toast('好友列表已更新'); }, 900); return;
    case '刷新动态':
      render(); toast('动态已刷新'); return;
    case '关于手机QQ': case '关于': go('about'); return;
    case '系统设置': case '设置':
      S.menu = {items:['消息提示音：'+(S.sound?'开':'关'),'震动提醒：开','自动登录：'+(S.login.auto?'开':'关'),'接收群消息：是','显示离线好友：是','清除缓存','返回'], sel:0};
      render(); return;
    case '退出':
      S.dialog = {title:'手机QQ', text:'确定要退出手机QQ吗？<br><span style="font-size:11px;color:#6a8496">退出后将无法接收消息</span>',
        yes:'是', no:'否',
        onYes:function(){ S.dialog = null; S.stack = []; S.screen = 'standby'; render(); toast('已退出手机QQ'); },
        onNo:function(){ S.dialog = null; render(); }};
      render(); return;
    case '返回': render(); return;
    case '删除好友': case '删除该聊天': case '退出该群':
      S.dialog = {title:'提示', text:'确定执行“'+esc(label)+'”吗？', yes:'确定', no:'取消',
        onYes:function(){ S.dialog = null; render(); toast('演示版无法执行该操作'); },
        onNo:function(){ S.dialog = null; render(); }};
      render(); return;
    default:
      if(label.indexOf('消息提示音') === 0){
        S.sound = !S.sound; render(); toast('消息提示音已'+(S.sound?'开启':'关闭'));
        if(S.sound) beep();
        return;
      }
      render(); toast('该功能在演示中不可用'); return;
  }
}

/* ---------- 软键 ---------- */
function onLeft(){
  if(S.dialog){ if(S.dialog.onYes) S.dialog.onYes(); return; }
  if(S.menu){ runMenu(S.menu.items[S.menu.sel]); return; }
  switch(S.screen){
    case 'standby': go('appmenu'); break;
    case 'login':   doLogin(); break;
    case 'appmenu': case 'main': case 'chat': case 'profile': openMenu(); break;
  }
}
function onRight(){
  if(S.dialog){ if(S.dialog.onNo) S.dialog.onNo(); return; }
  if(S.menu){ S.menu = null; render(); return; }
  switch(S.screen){
    case 'standby': toast('联系人：演示中不可用'); break;
    case 'login':   S.stack = []; S.screen = 'standby'; render(); break;
    case 'logging': S.stack = []; S.screen = 'login'; render(); toast('已取消登录'); break;
    case 'main':    runMenuExit(); break;
    default:        back();
  }
}
function runMenuExit(){
  S.dialog = {title:'手机QQ', text:'确定要退出手机QQ吗？<br><span style="font-size:11px;color:#6a8496">退出后将无法接收消息</span>',
    yes:'是', no:'否',
    onYes:function(){ S.dialog = null; S.stack = []; S.screen = 'standby'; render(); toast('已退出手机QQ'); },
    onNo:function(){ S.dialog = null; render(); }};
  render();
}

/* ---------- 中键 / 确定 ---------- */
function onSelect(){
  if(S.dialog){ if(S.dialog.onYes) S.dialog.onYes(); return; }
  if(S.menu){ runMenu(S.menu.items[S.menu.sel]); return; }
  if(S.screen === 'login'){ doLogin(); return; }
  if(S.screen === 'standby'){ go('appmenu'); return; }
  if(S.screen === 'chat'){ send(); return; }
  var its = items(), el = its[S.sel];
  if(!el) return;
  el.click();
}

/* ---------- 登录流程 ---------- */
function doLogin(){
  var q = view.querySelector('#in-qq');
  if(q) S.login.qq = q.value.trim() || '285746391';
  ME.qq = S.login.qq;
  ME.status = S.login.status;
  S.stack = []; S.screen = 'logging'; render();

  var steps = ['正在连接服务器…','正在验证账号…','正在接收好友列表…','正在同步离线消息…','登录成功'];
  var i = 0;
  var t = setInterval(function(){
    var tip = view.querySelector('#logtip'), pb = view.querySelector('#pb');
    if(!tip || !pb){ clearInterval(t); return; }
    tip.textContent = steps[i];
    pb.style.width = ((i+1)/steps.length*100) + '%';
    i++;
    if(i >= steps.length){
      clearInterval(t);
      setTimeout(function(){
        S.screen = 'main'; S.tab = 'msg'; S.sel = 0; render();
        beep(); toast('您有 '+unreadTotal()+' 条离线消息');
        scheduleNewMsg();
      }, 460);
    }
  }, 520);
}

/* 登录一会儿之后来条新消息，找回那种“突然嘀嘀两声”的感觉 */
function scheduleNewMsg(){
  if(S.newMsgFired) return;
  S.newMsgFired = true;
  setTimeout(function(){
    if(S.screen !== 'main' && S.screen !== 'chat') return;
    pushMsg('mengqi', {me:0, x:'在干嘛呢？陪我聊会天呗[偷笑]'});
    var c = CONVS.filter(function(x){ return x.id === 'mengqi'; })[0];
    if(!(S.screen === 'chat' && S.chat === 'mengqi')) c.unread++;
    beep(); vibrate(); render();
    if(S.screen === 'main') toast('梦琪ヽ浅唱那伤 发来一条消息');
  }, 14000);
}

/* ============================================================
   8. 事件绑定
   ============================================================ */
screenEl.addEventListener('click', function(e){
  /* 弹出菜单项 */
  var mi = e.target.closest ? e.target.closest('.mi') : null;
  if(mi && S.menu){ S.menu.sel = +mi.dataset.mi; runMenu(S.menu.items[S.menu.sel]); return; }
  if(S.dialog) return;

  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) {
    /* 点击普通列表项也高亮 */
    var it = e.target.closest ? e.target.closest('.item') : null;
    if(it){ S.sel = items().indexOf(it); applySel(); }
    return;
  }
  var it2 = el.closest('.item');
  if(it2){ var idx = items().indexOf(it2); if(idx >= 0) S.sel = idx; }

  var act = el.dataset.act;
  switch(act){
    case 'appmenu': go('appmenu'); break;
    case 'openqq':
      S.stack = []; S.screen = 'qqsplash'; render();
      setTimeout(function(){ if(S.screen === 'qqsplash'){ S.screen = 'login'; S.sel = 0; render(); } }, 1500);
      break;
    case 'tab': S.tab = el.dataset.k; S.sel = 0; render(); break;
    case 'grp': S.collapsed[el.dataset.g] = !S.collapsed[el.dataset.g]; render(); break;
    case 'chat': openChat(el.dataset.id); break;
    case 'myprofile': go('profile', {chat:'__me__'}); break;
    case 'send': send(); break;
    case 'emopanel': S.emo = !S.emo; render(); break;
    case 'emo': {
      var inp = view.querySelector('#in-msg');
      S.draft = (inp ? inp.value : (S.draft || '')) + '['+el.dataset.n+']';
      S.emo = false; render();
      var i2 = view.querySelector('#in-msg'); if(i2) i2.focus();
      break;
    }
    case 'tgl': S.login[el.dataset.k] = !S.login[el.dataset.k]; render(); break;
    case 'pickstatus': case 'pickstatus2':
      S.menu = {items:STATUS_LIST.concat(['返回']), sel:0, kind:'status'};
      render();
      break;
    case 'dologin': doLogin(); break;
    case 'nop': toast('该功能在演示中不可用'); break;
  }
});

/* 状态菜单单独处理 */
var _runMenu = runMenu;
runMenu = function(label){
  if(S.menu && S.menu.kind === 'status'){
    S.menu = null;
    if(label !== '返回'){
      S.login.status = label; ME.status = label;
      render(); toast('状态已切换为：'+label);
    }else render();
    return;
  }
  _runMenu(label);
};

lskB.addEventListener('click', onLeft);
rskB.addEventListener('click', onRight);
$('#kmenu').addEventListener('click', function(){
  if(S.dialog || S.menu){ onSelect(); return; }
  if(S.screen === 'standby'){ go('appmenu'); return; }
  onSelect();
});
$('#kcall').addEventListener('click', function(){ toast('拨号：演示中不可用'); });
$('#kend').addEventListener('click', function(){
  S.dialog = null; S.menu = null; S.stack = []; S.emo = false;
  S.screen = 'standby'; render();
});

document.addEventListener('keydown', function(e){
  var typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if(e.key === 'ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); moveSel(1); }
  else if(e.key === 'Enter'){
    if(typing && document.activeElement.id === 'in-msg'){ e.preventDefault(); send(); }
    else if(typing && document.activeElement.id === 'in-qq'){ e.preventDefault(); doLogin(); }
    else { e.preventDefault(); onSelect(); }
  }
  else if(e.key === 'Escape'){ e.preventDefault(); onRight(); }
  else if(e.key === 'ArrowLeft' && !typing){ e.preventDefault(); onLeft(); }
  else if(e.key === 'ArrowRight' && !typing){ e.preventDefault(); onRight(); }
});

/* ============================================================
   9. 时钟 & 自适应缩放
   ============================================================ */
/* 一台停在 2014 年那个晚上的手机：从 21:07 开始走 */
var T0 = Date.now(), BASE = 21*3600 + 7*60;
function nowHM(){
  var sec = BASE + Math.floor((Date.now() - T0)/1000);
  return pad(Math.floor(sec/3600) % 24) + ':' + pad(Math.floor(sec/60) % 60);
}
function tick(){
  var s = nowHM();
  $('#clock').textContent = s;
  var bc = document.getElementById('bigclock');
  if(bc) bc.textContent = s;
}
setInterval(tick, 1000); tick();

function fit(){
  var w = window.innerWidth - 20, h = window.innerHeight - 130;  /* 留出底部说明文字 */
  var s = Math.min(1, w/428, h/800);
  if(s < 0.42) s = 0.42;
  $('#stage').style.transform = 'scale('+s+')';
  $('#stage').style.height = (800*s + 10) + 'px';
  $('#stage').style.width = '428px';
}
window.addEventListener('resize', fit); fit();

/* ============================================================
   10. 开机
   ============================================================ */
render();
setTimeout(function(){ S.screen = 'standby'; render(); }, 1600);

})();
</script>
